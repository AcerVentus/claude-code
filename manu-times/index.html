<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..900,100;1,9..144,400..800,100&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a printed daily. Masthead with animated ears, a page index, then one "page" per section, turned like a real paper.
   One deliberate look: light coffee-brown newsprint in every theme. */
:root {
  --paper: #E6D5BD;        /* light coffee newsprint */
  --paper-deep: #DCC7AA;   /* panels, inset boxes */
  --ink: #2A2019;          /* espresso ink, softer than black */
  --ink-soft: #5E4B3B;
  --rule: #BFA585;
  --accent: #8A4F24;       /* cinnamon: labels, page numbers */
  --live: #A3381F;         /* press red: live marker, falls */
  --up: #3D6A36;
  --font-mast: "Fraunces", "Cooper Black", Georgia, serif;
  --font-head: "Fraunces", "Iowan Old Style", Georgia, serif;
  --font-body: "Literata", "Iowan Old Style", Georgia, serif;
  --font-mono: "IBM Plex Mono", "Courier New", ui-monospace, monospace;
  --measure: 66ch;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { background: var(--paper); }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 18px; line-height: 1.68;
  font-variation-settings: "SOFT" 100;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
  -webkit-font-smoothing: antialiased;
}
/* faint paper grain */
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .05; z-index: 50;
  background-image: radial-gradient(var(--ink) 0.5px, transparent 0.6px); background-size: 3px 3px; }
a { color: inherit; text-decoration-color: var(--rule); text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; }
.mono { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; }

/* ---------- Masthead ---------- */
.dateline-bar { display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--rule); padding-block: 10px; color: var(--ink-soft); }
.live { color: var(--live); display: inline-flex; align-items: center; gap: 6px; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--live); animation: pulse 2s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.masthead { text-align: center; padding-block: 22px 14px; }
.masthead h1 { font-family: var(--font-mast); font-weight: 900; margin: 0; line-height: 1;
  font-size: clamp(44px, 8.4vw, 98px); letter-spacing: -.02em; font-variation-settings: "SOFT" 100, "opsz" 144; }
.mast-row { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr) minmax(0, 190px); gap: 20px; align-items: center; }
.ear { border: 1px solid var(--ink); padding: 4px; text-align: center; }
.ear:empty { visibility: hidden; }
.ear .art { border: 1px solid var(--rule); }
.ear-label { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin-top: 4px; line-height: 1.3; }
.ear-label b { color: var(--accent); font-weight: 500; }
@media (max-width: 860px) { .mast-row { grid-template-columns: minmax(0, 1fr); } .ear { display: none; } }
.masthead h1 a { text-decoration: none; }
.motto { font-family: var(--font-head); font-style: italic; color: var(--ink-soft); margin-top: 8px; font-size: 16px; }
.mast-meta { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center;
  border-top: 3px double var(--ink); border-bottom: 1px solid var(--ink); padding-block: 7px; margin-top: 14px; }
.mast-meta > :first-child { text-align: left; } .mast-meta > :last-child { text-align: right; }
@media (max-width: 640px) { .mast-meta { grid-template-columns: 1fr; text-align: center; }
  .mast-meta > * { text-align: center !important; } }

/* ---------- Ticker ---------- */
.ticker { overflow: hidden; border-bottom: 1px solid var(--rule); padding-block: 8px; white-space: nowrap; position: relative; }
.ticker-track { display: inline-flex; gap: 34px; animation: tick 120s linear infinite; padding-right: 34px; }
.ticker:hover .ticker-track { animation-play-state: paused; }
@keyframes tick { to { transform: translateX(-50%); } }
.tk b { font-weight: 500; color: var(--ink); } .tk { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.pos { color: var(--up); } .neg { color: var(--live); }
@media (prefers-reduced-motion: reduce) { .ticker-track { animation: none; } .ticker { overflow-x: auto; } .live::before { animation: none; } }

/* ---------- Page index (section nav) ---------- */
nav.index { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper);
  border-bottom: 1px solid var(--ink); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
nav.index ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.index ul::-webkit-scrollbar { display: none; }
nav.index a { display: block; padding: 10px 10px 9px; text-decoration: none; white-space: nowrap;
  font-family: var(--font-head); font-size: 15px; border-bottom: 3px solid transparent; }
nav.index a .pg { font-family: var(--font-mono); font-size: 10px; color: var(--accent); margin-right: 5px; letter-spacing: .05em; }
nav.index a[aria-current="page"] { border-bottom-color: var(--accent); font-weight: 700; }
nav.index a:hover { background: var(--paper-deep); }

/* ---------- Page ---------- */
main { padding-top: 26px; min-height: 60vh; }
.page { animation: turn .45s ease-out; }
@keyframes turn { from { opacity: .3; transform: translateX(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .page { animation: none; } }
.page-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  border-bottom: 2px solid var(--ink); padding-bottom: 6px; margin-bottom: 22px; }
.page-head h2 { font-family: var(--font-head); font-style: italic; font-weight: 700; margin: 0; font-size: clamp(32px, 5vw, 52px); line-height: 1.05; }
.page-head .folio { color: var(--ink-soft); }
.page-head .folio b { color: var(--accent); font-weight: 500; }

.kicker { color: var(--accent); display: block; margin-bottom: 6px; }
h3.hl { font-family: var(--font-head); font-weight: 650; margin: 0 0 8px; line-height: 1.12; text-wrap: balance; }
.hl-xl { font-size: clamp(32px, 4.6vw, 56px); font-weight: 800 !important; letter-spacing: -.005em; }
.hl-l { font-size: clamp(24px, 3vw, 34px); }
.hl-m { font-size: 21px; }
.hl-s { font-size: 18px; }
.dek { font-family: var(--font-head); font-style: italic; font-size: clamp(18px, 2vw, 22px); color: var(--ink-soft); margin: 0 0 14px; line-height: 1.35; max-width: 60ch; }
.byline { color: var(--ink-soft); margin-bottom: 14px; }
.body p { margin: 0 0 .9em; hyphens: auto; }
.cols-2 { column-count: 2; column-gap: 34px; column-rule: 1px solid var(--rule); }
@media (max-width: 760px) { .cols-2 { column-count: 1; } }
.dropcap > p:first-child::first-letter { font-family: var(--font-head); font-weight: 900; float: left;
  font-size: 4.1em; line-height: .82; padding: .06em .08em 0 0; color: var(--ink); }
.sources { font-size: 13px; color: var(--ink-soft); margin-top: 8px; }
.sources a { color: var(--ink-soft); }
.sources .mono { font-size: 10.5px; margin-right: 4px; }

.lead-grid { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr); gap: 36px; padding-bottom: 26px; border-bottom: 1px solid var(--ink); }
.lead-grid > aside { border-left: 1px solid var(--rule); padding-left: 28px; }
@media (max-width: 900px) { .lead-grid { grid-template-columns: 1fr; } .lead-grid > aside { border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); padding-top: 18px; } }

.rail-title { font-family: var(--font-head); font-weight: 700; font-size: 19px; border-bottom: 1px solid var(--ink); padding-bottom: 4px; margin: 0 0 10px; }
.briefs { list-style: none; margin: 0; padding: 0; }
.briefs li { padding-block: 9px; border-bottom: 1px dotted var(--rule); font-size: 15px; line-height: 1.45; }
.briefs li::before { content: "■"; color: var(--accent); font-size: 8px; vertical-align: 3px; margin-right: 8px; }

.story-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 24px; }
.story-grid > article { padding: 0 22px 22px; border-left: 1px solid var(--rule); }
.story-grid > article:nth-child(3n+1) { border-left: 0; padding-left: 0; }
.story-grid > article:nth-child(3n) { padding-right: 0; }
.story-grid > article:nth-child(n+4) { border-top: 1px solid var(--rule); padding-top: 20px; }
.story-grid p { margin: 0; font-size: 15.5px; }
@media (max-width: 900px) { .story-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .story-grid > article { border-left: 1px solid var(--rule) !important; padding: 18px 18px 18px !important; border-top: 1px solid var(--rule); }
  .story-grid > article:nth-child(odd) { border-left: 0 !important; padding-left: 0 !important; } }
@media (max-width: 560px) { .story-grid { grid-template-columns: 1fr; }
  .story-grid > article { border-left: 0 !important; padding: 16px 0 !important; } }
.dl { color: var(--ink); font-weight: 500; }

/* ---------- Front page ---------- */
.front-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2.1fr) minmax(0, 1fr); gap: 0; border-bottom: 1px solid var(--ink); }
.front-grid > * { padding: 0 24px 24px; min-width: 0; }
.front-grid > :first-child { padding-left: 0; } .front-grid > :last-child { padding-right: 0; }
.front-grid > :nth-child(2) { border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); }
@media (max-width: 980px) { .front-grid { grid-template-columns: 1fr; } .front-grid > * { padding: 0 0 22px !important; border: 0 !important; }
  .front-grid > :nth-child(2) { order: -1; border-bottom: 1px solid var(--rule) !important; } }
.side-story { padding-block: 0 14px; margin-bottom: 14px; border-bottom: 1px solid var(--rule); }
.side-story:last-child { border-bottom: 0; }
.side-story p { margin: 0; font-size: 15px; }
.quote { font-family: var(--font-head); font-style: italic; font-size: 22px; line-height: 1.3; margin: 0 0 8px; }
.quote::before { content: "\201C"; font-size: 58px; line-height: 0; vertical-align: -24px; color: var(--accent); margin-right: 2px; }
.box { background: var(--paper-deep); padding: 16px 18px; margin-bottom: 20px; }
.numbers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--ink); }
.numbers > div { padding: 18px 20px; border-left: 1px solid var(--rule); }
.numbers > div:first-child { border-left: 0; padding-left: 0; }
.numbers .fig { font-family: var(--font-head); font-weight: 900; font-size: 34px; line-height: 1; font-variant-numeric: lining-nums; }
.numbers .lab { font-size: 14px; color: var(--ink-soft); margin-top: 6px; line-height: 1.35; }
@media (max-width: 760px) { .numbers { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .numbers > div { border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); } }
.inside { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; margin-top: 4px; }
.inside a { display: block; text-decoration: none; padding: 16px 18px 16px 0; border-bottom: 1px solid var(--rule); }
.inside a:hover h4 { text-decoration: underline; text-decoration-color: var(--accent); }
.inside h4 { font-family: var(--font-head); font-size: 17px; margin: 4px 0 0; line-height: 1.25; font-weight: 700; text-wrap: balance; }
@media (max-width: 900px) { .inside { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 520px) { .inside { grid-template-columns: 1fr; } }
.section-band { margin-top: 30px; }
.section-band > .rail-title { font-size: 22px; font-style: italic; }
.log { list-style: none; padding: 0; margin: 0; font-size: 14px; }
.log li { display: grid; grid-template-columns: 62px 1fr; gap: 8px; padding-block: 6px; border-bottom: 1px dotted var(--rule); }
.log time { font-family: var(--font-mono); font-size: 11px; color: var(--accent); padding-top: 2px; }

/* ---------- Tables (markets / movers) ---------- */
.table-wrap { overflow-x: auto; }
table.quotes { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
table.quotes th { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 500;
  color: var(--ink-soft); text-align: right; border-bottom: 1px solid var(--ink); padding: 6px 8px; }
table.quotes td { text-align: right; padding: 7px 8px; border-bottom: 1px dotted var(--rule); }
table.quotes th:first-child, table.quotes td:first-child { text-align: left; padding-left: 0; }
table.quotes td.why { text-align: left; color: var(--ink-soft); font-size: 14px; }
table.quotes td.asof { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-soft); }
.markets-top { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 36px; margin-bottom: 28px; padding-bottom: 26px; border-bottom: 1px solid var(--ink); }
@media (max-width: 900px) { .markets-top { grid-template-columns: 1fr; } }

/* ---------- Opinion ---------- */
.editorial { max-width: 760px; margin: 0 auto 34px; text-align: left; border-bottom: 1px solid var(--ink); padding-bottom: 26px; }
.editorial .kicker { text-align: center; }
.editorial h3 { text-align: center; }
.debate { padding-block: 26px; border-bottom: 1px solid var(--ink); }
.debate-head { max-width: 820px; margin: 0 auto 20px; text-align: center; }
.debate-head .context { color: var(--ink-soft); font-size: 15.5px; margin: 0; }
.views { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.views > article { padding: 0 28px; min-width: 0; }
.views > article:first-child { padding-left: 0; border-right: 1px solid var(--rule); }
.views > article:last-child { padding-right: 0; }
.stance { display: flex; justify-content: space-between; gap: 8px; border-top: 2px solid var(--ink); padding-top: 6px; margin-bottom: 10px; color: var(--ink-soft); }
.stance b { color: var(--ink); font-weight: 500; }
.views .body p { font-size: 16px; }
.bottom-line { max-width: 820px; margin: 18px auto 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 0; text-align: center; font-style: italic; }
.bottom-line .mono { font-style: normal; color: var(--accent); display: block; margin-bottom: 4px; }
.balance-note { text-align: center; color: var(--ink-soft); max-width: 640px; margin: -6px auto 26px; font-size: 15px; }
@media (max-width: 760px) { .views { grid-template-columns: 1fr; } .views > article { padding: 0 !important; border: 0 !important; }
  .views > article + article { margin-top: 22px; } }

/* ---------- Research ---------- */
.research-piece { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 36px; padding-block: 8px 30px; border-bottom: 1px solid var(--ink); margin-bottom: 26px; }
.research-piece aside { border-left: 1px solid var(--rule); padding-left: 26px; }
.findings { margin: 0; padding-left: 20px; font-size: 15px; }
.findings li { margin-bottom: 8px; }
.findings li::marker { color: var(--accent); font-family: var(--font-mono); font-size: 12px; }
.method { font-size: 13.5px; color: var(--ink-soft); font-style: italic; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--font-mono); font-size: 10px; fill: var(--ink-soft); }
.chart .val { fill: var(--ink); font-weight: 500; }
.chart rect.bar { fill: var(--accent); }
@media (max-width: 900px) { .research-piece { grid-template-columns: 1fr; } .research-piece aside { border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); padding-top: 16px; } }

/* ---------- Animated ink: illustrators tag SVG groups with these classes ---------- */
.art [class*="anim-"] { transform-box: fill-box; transform-origin: center; }
.art .anim-spin { animation: a-spin 12s linear infinite; } .art .anim-spin-fast { animation: a-spin 4s linear infinite; }
@keyframes a-spin { to { transform: rotate(360deg); } }
.art .anim-bob { animation: a-bob 3s ease-in-out infinite; } @keyframes a-bob { 50% { transform: translateY(-4px); } }
.art .anim-sway { animation: a-sway 3s ease-in-out infinite; } @keyframes a-sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
.art .anim-drift { animation: a-drift 9s ease-in-out infinite; } @keyframes a-drift { 50% { transform: translateX(30px); } }
.art .anim-cross { animation: a-cross 14s linear infinite; } @keyframes a-cross { from { transform: translateX(0); } to { transform: translateX(300px); } }
.art .anim-fall { animation: a-fall 1.2s linear infinite; } @keyframes a-fall { from { transform: translateY(-6px); opacity: 1; } to { transform: translateY(20px); opacity: 0; } }
.art .anim-steam { animation: a-steam 2.5s ease-out infinite; } @keyframes a-steam { from { transform: translateY(0) scale(.7); opacity: .9; } to { transform: translateY(-14px) scale(1.3); opacity: 0; } }
.art .anim-blink { animation: a-blink 4s steps(1) infinite; } @keyframes a-blink { 0%, 92% { opacity: 0; } 93%, 96% { opacity: 1; } }
.art .anim-flap { animation: a-flap .6s ease-in-out infinite; } @keyframes a-flap { 50% { transform: scaleY(.4); } }
.art .d1 { animation-delay: .3s; } .art .d2 { animation-delay: .6s; } .art .d3 { animation-delay: .9s; } .art .d4 { animation-delay: 1.2s; }
/* page-head vignettes ink themselves in on every page turn */
.vignette .line, .vignette .line-tint { animation: ink-in 1.8s ease-out; }
@keyframes ink-in { from { stroke-dasharray: 1000; stroke-dashoffset: 1000; } to { stroke-dasharray: 1000; stroke-dashoffset: 0; } }
.vignette .ink, .vignette .tint { animation: ink-fill 1.4s ease-out both; } @keyframes ink-fill { from { opacity: .15; } }
/* the daily reveal: one of several entrance styles, chosen by date (set on <html data-reveal>) */
[data-reveal="rise"] .page .reveal { animation: rv-rise .7s ease-out both; }
[data-reveal="ink"] .page .reveal { animation: rv-ink .9s ease-out both; }
[data-reveal="press"] .page .reveal { animation: rv-press .6s cubic-bezier(.2,.8,.3,1.2) both; }
[data-reveal="slide"] .page .reveal { animation: rv-slide .7s ease-out both; }
@keyframes rv-rise { from { opacity: .2; transform: translateY(14px); } }
@keyframes rv-ink { from { opacity: .1; filter: blur(3px); } }
@keyframes rv-press { from { opacity: .2; transform: scale(.97); } }
@keyframes rv-slide { from { opacity: .2; transform: translateX(-16px); } }
.page .reveal:nth-child(2) { animation-delay: .08s; } .page .reveal:nth-child(3) { animation-delay: .16s; }
.page .reveal:nth-child(4) { animation-delay: .24s; } .page .reveal:nth-child(5) { animation-delay: .32s; } .page .reveal:nth-child(n+6) { animation-delay: .4s; }
@media (prefers-reduced-motion: reduce) { .art *, .vignette *, .page .reveal { animation: none !important; } }

/* spot illustrations sit in the story grid like a picture cell */
.story-grid > figure.spot { margin: 0; }
figure.spot .art { background: var(--paper-deep); padding: 8px; border: 1px solid var(--rule); }
figure.spot figcaption { font-family: var(--font-head); font-style: italic; font-size: 15px; color: var(--ink-soft); text-align: center; margin-top: 8px; text-wrap: balance; }
.page-cartoon { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 36px; align-items: center; padding-block: 26px; border-bottom: 1px solid var(--ink); }
.page-cartoon .aside-note { font-size: 15px; color: var(--ink-soft); }
@media (max-width: 860px) { .page-cartoon { grid-template-columns: 1fr; } }

/* ---------- Ink art (vignettes + cartoon); drawings colour themselves from the tokens ---------- */
.art .ink { fill: var(--ink); } .art .paper { fill: var(--paper); } .art .tint { fill: var(--accent); }
.art .line { fill: none; stroke: var(--ink); } .art .line-tint { fill: none; stroke: var(--accent); }
.art svg { display: block; width: 100%; height: auto; }
.art text { fill: var(--ink); }
.ph-left { display: flex; align-items: flex-end; gap: 14px; min-width: 0; }
.vignette { width: 84px; flex: none; }
@media (max-width: 560px) { .vignette { width: 58px; } }
.cartoon-band { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 36px; margin-top: 30px; padding-bottom: 26px; border-bottom: 1px solid var(--ink); }
@media (max-width: 900px) { .cartoon-band { grid-template-columns: 1fr; } }
figure.cartoon { margin: 0; }
figure.cartoon .frame { border: 2px solid var(--ink); outline: 1px solid var(--ink); outline-offset: 4px; padding: 10px; background: var(--paper); margin: 6px; }
figure.cartoon figcaption { font-family: var(--font-head); font-style: italic; font-size: 19px; text-align: center; margin-top: 14px; text-wrap: balance; }
figure.cartoon .story { display: block; font-family: var(--font-body); font-style: normal; font-size: 13.5px; color: var(--ink-soft); margin-top: 4px; }
.x-list a { display: grid; grid-template-columns: 1fr auto; gap: 10px; text-decoration: none; padding-block: 12px; border-bottom: 1px solid var(--rule); }
.x-list h4 { font-family: var(--font-head); font-size: 18px; margin: 3px 0 2px; line-height: 1.2; }

<div class="wrap">
  <div class="dateline-bar mono">
    <span id="edition-line">Vol. I</span>
    <span class="live" id="live-line">Live edition</span>
  </div>
  <header class="masthead">
    <div class="mast-row">
      <div class="ear" id="ear-left"></div>
      <div><h1><a href="#front">The Manu Times</a></h1>
        <div class="motto">All the world&rsquo;s news, weighed and balanced.</div></div>
      <div class="ear" id="ear-right"></div>
    </div>

      <span id="date-line"></span>
      <span>Global Edition</span>
      <span id="updated-line"></span>

    <span class="mono">Keys: &larr; &rarr; turn the page</span>
  </footer>
</div>

<script>
const PAGES = [
  ["front", "A1", "Front Page"], ["world", "A2", "World"], ["us", "A3", "The US"], ["politics", "A4", "Politics"],
  ["europe", "A5", "Europe"], ["gulf", "A6", "The Gulf"], ["asia", "A7", "Asia"], ["africa", "A8", "Africa"],
  ["americas", "A9", "The Americas"], ["business", "B1", "Business"], ["markets", "B2", "Markets"], ["stocks", "B3", "Stocks"], ["lex", "B4", "Lex"],
  ["tech", "B5", "Technology"], ["energy", "B6", "Energy"], ["healthcare", "B7", "Healthcare"],
  ["research", "C1", "Research"], ["opinion", "C2", "Opinion"]
];
const IDS = PAGES.map(p => p[0]);
let ED = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? esc(u) : "#";
const paras = arr => (arr || []).map(p => `<p>${esc(p)}</p>`).join("");
const sources = list => (list && list.length) ? `<div class="sources"><span class="mono">Sources</span> ${list.map(s =>
  `<a href="${safeUrl(s.url)}" target="_blank" rel="noopener">${esc(s.name || "Link")}</a>`).join(" &middot; ")}</div>` : "";
const pageOf = id => PAGES.find(p => p[0] === id) || PAGES[0];
const changeClass = c => /^\s*[-−–]/.test(c || "") ? "neg" : (/^\s*\+/.test(c || "") ? "pos" : "");

function fmtDate(iso) {
  const d = iso ? new Date(iso + "T12:00:00Z") : new Date();
  return d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
}
function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "UTC" }) + " GMT";
}

function dayIndex() {
  const d = ED?.meta?.date ? new Date(ED.meta.date + "T00:00:00Z") : new Date();
  return Math.floor(d.getTime() / 86400000);
}
function renderEars() {
  if (!SCENES || !ED) return;
  const day = dayIndex();
  document.documentElement.dataset.reveal = ["rise", "ink", "press", "slide"][day % 4];
  const sp = ((ED.markets && ED.markets.snapshot) || []).find(r => /S&P/i.test(r.name));
  const ch = sp ? parseFloat(String(sp.change).replace(/[−–]/g, "-").replace(/[^0-9.+-]/g, "")) : NaN;
  const mood = !isFinite(ch) ? "flat" : ch > 0.3 ? "up" : ch < -0.3 ? "down" : "flat";
  const words = { up: "Fair and sunny", flat: "Changeable", down: "Stormy" }[mood];
  const L = SCENES.mood && cleanSvg(SCENES.mood[mood]);
  if (L) document.getElementById("ear-left").innerHTML = `<div class="art" role="img" aria-label="Market weather: ${words}">${L}</div>
    <div class="ear-label">Market weather: <b>${words}</b>${sp ? `<br>${esc(sp.name)} ${esc(sp.change)}` : ""}</div>`;
  const daily = SCENES.daily || [];
  if (daily.length) {
    const sc = daily[day % daily.length], R = cleanSvg(sc.svg);
    if (R) document.getElementById("ear-right").innerHTML = `<div class="art" role="img" aria-label="${esc(sc.title)}">${R}</div>
      <div class="ear-label">Today&rsquo;s scene: <b>${esc(sc.title)}</b></div>`;
  }
}
function renderChrome() {
  renderEars();
  const m = ED.meta || {};
  document.getElementById("edition-line").textContent = `Vol. I · No. ${m.edition_no || 1} · ${m.price || "Free to all readers"}`;
  document.getElementById("date-line").textContent = fmtDate(m.date);
  document.getElementById("updated-line").textContent = m.updated_at ? `Updated ${fmtTime(m.updated_at)}` : "";
  document.getElementById("live-line").textContent = m.updated_at ? `Latest edition · ${fmtTime(m.updated_at)}` : `Latest edition`;
  const snap = (ED.markets && ED.markets.snapshot) || [];
  const t = snap.map(s => `<span class="tk"><b>${esc(s.name)}</b> ${esc(s.value)} <span class="${changeClass(s.change)}">${esc(s.change || "")}</span></span>`).join("");
  document.getElementById("ticker").innerHTML = t ? t + `<span aria-hidden="true" style="display:contents">${t}</span>` : `<span class="tk">Markets data is on its way to the press.</span>`;
  document.getElementById("nav").innerHTML = PAGES.map(([id, pg, name]) =>
    `<li><a href="#${id}" data-id="${id}"><span class="pg">${pg}</span>${esc(name)}</a></li>`).join("");
}

// Ink drawings are inlined so they take the theme's colours; strip anything that is not plain drawing.
function cleanSvg(src) {
  if (!src || typeof src !== "string") return "";
  const doc = new DOMParser().parseFromString(src, "image/svg+xml");
  const svg = doc.documentElement;
  if (!svg || svg.nodeName.toLowerCase() !== "svg" || doc.querySelector("parsererror")) return "";
  svg.querySelectorAll("script, foreignObject, image, iframe, a").forEach(n => n.remove());
  [svg, ...svg.querySelectorAll("*")].forEach(n => [...n.attributes].forEach(a => {
    const k = a.name.toLowerCase();
    if (k.startsWith("on") || ((k === "href" || k === "xlink:href") && !a.value.startsWith("#")) || k === "style") n.removeAttribute(a.name);
  }));
  svg.removeAttribute("width"); svg.removeAttribute("height");
  return new XMLSerializer().serializeToString(svg);
}
let ART = {};
const vignette = id => ART[id] ? `<div class="vignette art" aria-hidden="true">${ART[id]}</div>` : "";

function pageHead(id) {
  const [, pg, name] = pageOf(id);
  return `<div class="page-head"><div class="ph-left">${vignette(id)}<h2>${esc(name)}</h2></div><span class="folio mono">Page <b>${pg}</b> · ${esc(fmtDate(ED.meta?.date))}</span></div>`;
}

/* ---- Explainers ---- */
let XS = [];
const xItems = () => (ED.explainers && ED.explainers.items) || [];
function explainersFor(id) {
  return xItems().filter(x => x.section === id).map(x => {
    const k = XS.push(x) - 1;
    return `<section class="explainer" id="x-${esc(x.id || k)}" data-x="${k}" tabindex="-1" aria-roledescription="slideshow" aria-label="${esc(x.title)}">
      <div class="x-head"><div><span class="kicker mono">Explained · ${(x.slides || []).length} slides</span>
        <h3 class="hl hl-l">${esc(x.title)}</h3>${x.dek ? `<p class="dek">${esc(x.dek)}</p>` : ""}</div></div>
      <div class="x-stage" aria-live="polite"></div>
      <div class="x-controls"><button class="x-btn" data-dir="-1" type="button">&larr; Back</button>
        <div class="x-dots">${(x.slides || []).map((s, i) => `<button type="button" data-go="${i}" aria-label="Slide ${i + 1}: ${esc(s.title)}"></button>`).join("")}</div>
        <button class="x-btn" data-dir="1" type="button">Next &rarr;</button></div>
      ${sources(x.sources)}</section>`;
  }).join("");
}
function niceTicks(lo, hi, n = 4) {
  const span = hi - lo || Math.abs(hi) || 1, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  const start = Math.floor(lo / step) * step, out = [];
  for (let v = start; v <= hi + step * .5; v += step) out.push(+v.toFixed(10));
  return out;
}
const fmtN = v => Math.abs(v) >= 1000 ? v.toLocaleString("en-GB", { maximumFractionDigits: 0 }) : String(+(+v).toFixed(2));
function visual(v) {
  if (!v) return "";
  if (v.type === "stat") return `<div class="x-stat"><div class="big">${esc(v.value)}</div><div class="lab">${esc(v.label)}</div>${v.sub ? `<div class="sub">${esc(v.sub)}</div>` : ""}</div>`;
  if (v.type === "timeline") return `<ol class="x-timeline">${(v.events || []).map((e, i) =>
    `<li style="animation-delay:${i * 110}ms"><time>${esc(e.date)}</time>${esc(e.text)}</li>`).join("")}</ol>`;
  if (v.type === "compare") return `<div class="x-compare">${["left", "right"].map(side => v[side] ? `<div><h5>${esc(v[side].title)}</h5><ul>${(v[side].points || []).map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>` : "").join("")}</div>`;
  if (v.type === "bar") {
    const items = (v.items || []).filter(d => isFinite(+d.value));
    if (!items.length) return "";
    const W = 520, row = 34, lw = 150, vw = 80, H = items.length * row + 8, vals = items.map(d => +d.value);
    const lo = Math.min(0, ...vals), hi = Math.max(0, ...vals), sx = x => lw + (x - lo) / ((hi - lo) || 1) * (W - lw - vw);
    const bars = items.map((d, i) => {
      const y = i * row + 6, x0 = sx(Math.min(0, d.value)), w = Math.max(2, Math.abs(sx(d.value) - sx(0)));
      return `<text class="lbl" x="${lw - 10}" y="${y + 17}" text-anchor="end">${esc(String(d.label).slice(0, 24))}</text>
        <rect class="b${d.highlight ? " hi" : ""}" x="${x0.toFixed(1)}" y="${y + 4}" width="${w.toFixed(1)}" height="18" style="animation-delay:${i * 70}ms"></rect>
        <text class="val" x="${(Math.max(sx(d.value), sx(0)) + 6).toFixed(1)}" y="${y + 18}">${esc(fmtN(+d.value))}${esc(v.unit || "")}</text>`;
    }).join("");
    return `<div class="x-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart">
      <line class="axis" x1="${sx(0).toFixed(1)}" x2="${sx(0).toFixed(1)}" y1="2" y2="${H}"></line>${bars}</svg></div>`;
  }
  if (v.type === "line") {
    const series = (v.series || []).filter(s => (s.points || []).length > 1).slice(0, 3);
    if (!series.length) return "";
    const xs = series[0].points.map(p => p.x), all = series.flatMap(s => s.points.map(p => +p.y)).filter(isFinite);
    const ticks = niceTicks(Math.min(...all), Math.max(...all)), lo = ticks[0], hi = ticks[ticks.length - 1];
    const W = 560, H = 300, L = 52, R = 18, T = 12, B = 30;
    const sx = i => L + i / (xs.length - 1) * (W - L - R), sy = y => T + (1 - (y - lo) / ((hi - lo) || 1)) * (H - T - B);
    const grid = ticks.map(t => `<line class="grid" x1="${L}" x2="${W - R}" y1="${sy(t).toFixed(1)}" y2="${sy(t).toFixed(1)}"></line>
      <text x="${L - 8}" y="${(sy(t) + 4).toFixed(1)}" text-anchor="end">${esc(fmtN(t))}</text>`).join("");
    const every = Math.ceil(xs.length / 7);
    const xl = xs.map((x, i) => (i % every === 0 || i === xs.length - 1) ? `<text x="${sx(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(x)}</text>` : "").join("");
    const paths = series.map((s, k) => {

      <rect class="bar" x="${labelW}" y="${y + 3}" width="${w.toFixed(1)}" height="14"></rect>

    ED = next; renderChrome(); show();

}

});
fetch("art/scenes.json").then(r => r.ok ? r.json() : null).then(v => { SCENES = v; renderEars(); }).catch(() => {});
fetch("art/spots.json").then(r => r.ok ? r.json() : {}).then(v => {
  SPOTS = Object.fromEntries(Object.entries(v || {}).map(([k, o]) => [k, { caption: o.caption, svg: cleanSvg(o.svg) }]).filter(([, o]) => o.svg));
  if (ED) show();
}).catch(() => {});
fetch("art/vignettes.json").then(r => r.ok ? r.json() : {}).then(v => {
  ART = Object.fromEntries(Object.entries(v || {}).map(([k, s]) => [k, cleanSvg(s)]).filter(([, s]) => s));
  if (ED) show();
}).catch(() => {});
load(true);
setInterval(() => load(false), 10 * 60 * 1000);  // pick up a new edition without a reload
</script>
