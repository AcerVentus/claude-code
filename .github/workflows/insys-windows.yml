name: "InSys Windows build"

# Builds InSys.exe (insys/packaging) on a real Windows machine, runs the server
# tests there, then starts the built program and uses it. This workflow does
# not call Claude.
on:
  push:
    paths:
      - "insys/**"
      - ".github/workflows/insys-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: insys
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Run the server tests on Windows
        run: python -m unittest discover -s tests -v

      - name: Build InSys.exe
        run: python packaging/build_exe.py

      - name: Start InSys.exe and use it
        run: python packaging/smoke_test.py dist/InSys.exe

      - name: Upload InSys.exe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: InSys-windows
          path: insys/dist/InSys.exe
          if-no-files-found: error
