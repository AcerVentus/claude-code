<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STAAD Viewer</title>
<style>
:root{
  --bg:#e9ece9; --panel:#fbfbfa; --panel2:#f0f2f0; --line:#d3d8d4; --ink:#1b2126; --mute:#5c6770;
  --accent:#0b62b8; --accent-ink:#ffffff; --canvas:#f6f7f5;
  --member:#27425f; --plate:#4f86b3; --node:#1b2126; --support:#0f7a45; --load:#c2391b;
  --sel:#d97f00; --hover:#0b62b8; --halo:rgba(246,247,245,.88); --dim:rgba(40,60,80,.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101417; --panel:#171c20; --panel2:#1e252a; --line:#2c353c; --ink:#e4e9ec; --mute:#95a2ab;
    --accent:#58a6f0; --accent-ink:#0b1116; --canvas:#12171b;
    --member:#b9cbdc; --plate:#5f9fd0; --node:#e4e9ec; --support:#3fc887; --load:#ff7a55;
    --sel:#ffb02e; --hover:#58a6f0; --halo:rgba(18,23,27,.88); --dim:rgba(190,205,220,.14);
  }
}
:root[data-theme="dark"]{
  --bg:#101417; --panel:#171c20; --panel2:#1e252a; --line:#2c353c; --ink:#e4e9ec; --mute:#95a2ab;
  --accent:#58a6f0; --accent-ink:#0b1116; --canvas:#12171b;
  --member:#b9cbdc; --plate:#5f9fd0; --node:#e4e9ec; --support:#3fc887; --load:#ff7a55;
  --sel:#ffb02e; --hover:#58a6f0; --halo:rgba(18,23,27,.88); --dim:rgba(190,205,220,.14);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--mute)}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
select,input[type=text],input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;min-width:0}

header{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.02em;margin-right:4px}
.brand i{font-style:normal;color:var(--accent)}
#fname{color:var(--mute);max-width:26ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spacer{flex:1}
.seg{display:flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}
.seg button:last-child{border-radius:0 6px 6px 0}
#find{width:13ch}

main{flex:1;display:flex;min-height:0}
aside{width:330px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel);min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel2)}
.tabs button{flex:1;border:0;border-radius:0;background:none;padding:8px 4px;color:var(--mute);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600;background:var(--panel)}
.panel{flex:1;overflow:auto;padding:12px;min-height:0;display:none}
.panel.on{display:block}
.panel.flexcol.on{display:flex;flex-direction:column;padding:0}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:16px 0 6px;font-weight:600}
h2:first-child{margin-top:0}
h3{font-size:15px;margin:0 0 2px}
.sub{color:var(--mute);margin:0 0 8px;overflow-wrap:anywhere}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0}
dl.kv dt{color:var(--mute)}
dl.kv dd{margin:0;text-align:right;overflow-wrap:anywhere}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px}
.checks label{display:flex;gap:6px;align-items:center;cursor:pointer}
.row{display:flex;gap:8px;align-items:center;margin:4px 0}
.row select{flex:1}
.legend{margin-top:6px;display:flex;flex-direction:column;gap:1px}
.legend button{display:flex;gap:8px;align-items:center;border:0;background:none;padding:3px 4px;text-align:left;border-radius:4px}
.legend button:hover{background:var(--panel2)}
.legend button[aria-pressed="true"]{background:var(--panel2);color:var(--ink);outline:1px solid var(--line)}
.legend .sw{width:12px;height:12px;border-radius:3px;flex:none}
.legend .lb{flex:1;overflow:hidden;text-overflow:ellipsis}
.legend .ct{color:var(--mute)}
.warn{border-left:3px solid var(--sel);background:var(--panel2);padding:6px 8px;margin:3px 0;border-radius:0 4px 4px 0}
.warn a{color:var(--accent);cursor:pointer}
pre.raw{margin:6px 0 0;padding:8px;background:var(--panel2);border-radius:6px;overflow:auto;max-height:220px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.chip{border:1px solid var(--line);border-radius:10px;padding:0 7px;cursor:pointer;background:var(--panel2)}
.chip:hover{border-color:var(--accent)}
.actions{display:flex;gap:6px;margin:8px 0 12px;flex-wrap:wrap}
.empty{color:var(--mute);padding:20px 4px;text-align:center}

.tblbar{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--line)}
.tblbar input{flex:1}
.tblwrap{flex:1;overflow:auto;min-height:0}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:3px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--panel2);color:var(--mute);font-weight:600}
th:last-child,td:last-child{text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel2)}
tbody tr.on{background:var(--sel);color:#111}
.more{padding:8px;text-align:center}

.src{flex:1;overflow:auto;min-height:0;font-size:12px;line-height:18px;position:relative}
.src-pad{position:relative;min-width:max-content}
.src-win{position:absolute;left:0;top:0;min-width:100%}
.ln{display:flex;height:18px;white-space:pre}
.ln .no{flex:none;width:6ch;text-align:right;padding-right:1ch;color:var(--mute);user-select:none;background:var(--panel2)}
.ln .tx{padding:0 8px}
.ln.cm .tx{color:var(--mute)}
.ln.hl{background:var(--sel);color:#111}
.ln.hl .no{background:var(--sel);color:#111}

#stage{flex:1;position:relative;min-width:0;background:var(--canvas)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
canvas.drag{cursor:grabbing}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--panel);padding:3px 8px;border-radius:5px;font-size:12px;
  white-space:nowrap;display:none;z-index:3}
#hud{position:absolute;right:10px;bottom:8px;color:var(--mute);font-size:11px;pointer-events:none;text-align:right}
#banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:6px 12px;display:none;max-width:90%;z-index:2}
#drop{position:absolute;inset:8px;border:2px dashed var(--accent);border-radius:12px;display:none;align-items:center;justify-content:center;
  font-size:18px;font-weight:600;color:var(--accent);background:var(--halo);z-index:5;pointer-events:none}
body.dragover #drop{display:flex}

@media (max-width:760px){
  main{flex-direction:column-reverse}
  aside{width:100%;height:44%;border-right:0;border-top:1px solid var(--line)}
  #hud{display:none}
  #fname{max-width:14ch}
}
</style>
</head>
<body>
<header>
  <div class="brand">STAAD<i>·</i>Viewer</div>
  <button class="primary" id="openBtn" title="Open a STAAD input file (.std)">Open .std…</button>
  <input type="file" id="file" accept=".std,.STD,.txt,text/plain" hidden>
  <span id="fname" title=""></span>
  <div class="spacer"></div>
  <input type="search" id="find" placeholder="Find n12, m7…" title="Jump to an entity: n12 (node), m7 (member), p3 (plate). A bare number looks for a member first." aria-label="Find entity">
  <div class="seg" role="group" aria-label="View direction">
    <button data-view="iso" title="Isometric (1)">Iso</button>
    <button data-view="front" title="Front elevation (2)">Front</button>
    <button data-view="side" title="Side elevation (3)">Side</button>
    <button data-view="top" title="Plan (4)">Top</button>
  </div>
  <button id="fitBtn" title="Fit model to window (F)">Fit</button>
  <button id="projBtn" aria-pressed="false" title="Toggle perspective projection (P)">Perspective</button>
  <button id="themeBtn" title="Switch light / dark">Theme</button>
</header>
<main>
  <aside>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="model" aria-selected="true">Model</button>
      <button role="tab" data-tab="sel" aria-selected="false">Selection</button>
      <button role="tab" data-tab="tables" aria-selected="false">Tables</button>
      <button role="tab" data-tab="source" aria-selected="false">Source</button>
    </div>
    <div class="panel on" id="p-model"></div>
    <div class="panel" id="p-sel"></div>
    <div class="panel flexcol" id="p-tables">
      <div class="tblbar">
        <select id="tblKind" aria-label="Table">
          <option value="nodes">Nodes</option><option value="members">Members</option><option value="plates">Plates</option>
          <option value="supports">Supports</option><option value="sections">Sections</option>
        </select>
        <input type="search" id="tblFilter" placeholder="Filter…" aria-label="Filter rows">
      </div>
      <div class="tblwrap" id="tblWrap"></div>
    </div>
    <div class="panel flexcol" id="p-source">
      <div class="src mono" id="src" tabindex="0"><div class="src-pad" id="srcPad"><div class="src-win" id="srcWin"></div></div></div>
    </div>
  </aside>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="banner"></div>
    <div id="tip"></div>
    <div id="hud">Drag: orbit · Shift/right-drag: pan · Wheel: zoom · Click: select · Double-click: centre</div>
    <div id="drop">Drop a STAAD .std file to view it</div>
  </div>
</main>

<script>
'use strict';
/* =====================================================================================
   STAAD.Pro input (.std) parser
   Reads the text command file: geometry, properties, supports, groups, loads.
   ===================================================================================== */
const LEN_UNITS = {INC:[0.0254,'in'],FEE:[0.3048,'ft'],FT:[0.3048,'ft'],CM:[0.01,'cm'],MET:[1,'m'],MMS:[0.001,'mm'],MM:[0.001,'mm'],DME:[0.1,'dm'],KM:[1000,'km']};
const FRC_UNITS = {KIP:[4448.2216,'kip'],POU:[4.4482216,'lb'],LBS:[4.4482216,'lb'],KG:[9.80665,'kg'],MTO:[9806.65,'MTon'],NEW:[1,'N'],KNS:[1000,'kN'],KN:[1000,'kN'],MNS:[1e6,'MN'],MN:[1e6,'MN'],DNS:[10,'daN'],DN:[10,'daN']};
const NUM_RE = /^[+-]?(\d+\.?\d*|\.\d+)([ED][+-]?\d+)?$/i;
const isNum = s => s !== undefined && NUM_RE.test(s);
const isInt = s => s !== undefined && /^[+-]?\d+$/.test(s);
const num = s => isNum(s) ? parseFloat(s.replace(/d/i, 'e')) : NaN;
const kw = (tok, full, min = 3) => tok !== undefined && tok.length >= Math.min(min, full.length) && full.startsWith(tok);

function parseStaad(text) {
  const M = {
    title: '', type: '', zUp: false, job: [], lines: text.split(/\r\n|\r|\n/),
    nodes: new Map(), members: new Map(), plates: new Map(), solids: new Map(),
    supports: new Map(), groups: new Map(), materials: new Map(), sections: [],
    loads: [], combos: [], warnings: [], lenUnit: '', lenF: 1, unitSeen: false, recognised: false
  };
  const warn = (line, msg) => { if (M.warnings.length < 300) M.warnings.push({ line, msg }); };
  let len = { f: 1, n: 'm' }, frc = { f: 1000, n: 'kN' }, baseLen = null;
  let section = 'other', groupKind = 'MEMBER', attr = '', country = '';
  let jc = null, inc = null, lineOut = [];
  let curLoad = null, curCombo = null, curMat = null;
  const secIndex = new Map();
  let dupNodes = 0;

  // ---- physical lines -> logical lines (comments dropped, '-' continuations joined)
  const logical = [];
  {
    let buf = null, bufLine = 0;
    for (let i = 0; i < M.lines.length; i++) {
      let s = M.lines[i].trim();
      if (!s || s[0] === '*') continue;
      if (buf !== null) s = buf + ' ' + s; else bufLine = i + 1;
      if (/-$/.test(s) && !/^(STAAD|JOB|ENGINEER|CHECKER|APPROVED|LOAD\s)/i.test(s)) { buf = s.slice(0, -1).trimEnd(); continue; }
      buf = null; logical.push({ s, line: bufLine });
    }
    if (buf !== null) logical.push({ s: buf, line: bufLine });
  }

  // ---- entity lists: "1 2 5 TO 9 BY 2 _GROUP"
  function parseList(t, i) {
    const ids = []; let last = null, used = false;
    while (i < t.length) {
      const k = t[i];
      if (isInt(k)) { last = +k; ids.push(last); i++; used = true; }
      else if (k === 'TO' && last !== null && isInt(t[i + 1])) {
        const end = +t[i + 1]; let step = 1; i += 2;
        if (t[i] === 'BY' && isInt(t[i + 1])) { step = Math.max(1, +t[i + 1]); i += 2; }
        if (end - last < 5e6) for (let v = last + step; v <= end; v += step) ids.push(v);
        last = end;
      }
      else if (k[0] === '_') { const g = M.groups.get(k); if (g) for (const v of g.ids) ids.push(v); i++; used = true; last = null; }
      else break;
    }
    return { ids, next: i, used };
  }
  function targets(t, i) {
    if (t[i] === 'ALL') return { all: true, ids: [] };
    if (kw(t[i], 'MEMBER') || kw(t[i], 'BEAM') || kw(t[i], 'PLATE') || kw(t[i], 'ELEMENT') || kw(t[i], 'SOLID')) i++;
    if (t[i] === 'ALL' || i >= t.length) return { all: true, ids: [] };
    return { all: false, ids: parseList(t, i).ids };
  }
  const endLoad = () => { curLoad = null; curCombo = null; };

  // ---- geometry writers
  function putJoint(id, a, b, c, line) {
    let x, y, z;
    if (jc.mode === 1) { const th = b * Math.PI / 180; x = a * Math.cos(th); y = a * Math.sin(th); z = c; }
    else if (jc.mode === 2) { const th = c * Math.PI / 180; x = a * Math.cos(th); y = b; z = a * Math.sin(th); }
    else { x = a; y = b; z = c; }
    const k = len.f / baseLen.f;
    if (M.nodes.has(id)) dupNodes++;
    M.nodes.set(id, { id, x: x * k, y: y * k, z: z * k, line });
    const e = { id, a, b, c }; jc.block.push(e); lineOut.push(e);
  }
  function putMember(id, a, b, line) {
    if (M.members.has(id)) warn(line, `Member ${id} is defined more than once`);
    M.members.set(id, { id, a, b, line, sec: -1, beta: 0, mat: '', rel: null, attr: '' });
    const e = { id, n: [a, b] }; inc.block.push(e); lineOut.push(e);
  }
  function putElem(id, n, line, solid) {
    const map = solid ? M.solids : M.plates;
    if (!solid) { n = n.filter(v => v > 0); if (n.length > 4) n = n.slice(0, 4); if (n.length === 4 && n[3] === n[2]) n.pop(); }
    if (map.has(id)) warn(line, `${solid ? 'Solid' : 'Plate'} ${id} is defined more than once`);
    map.set(id, { id, n, line, thk: null, thkUnit: '', mat: '' });
    const e = { id, n }; inc.block.push(e); lineOut.push(e);
  }
  function repeatSrc(st, all) {
    if (all) { const s = st.block.slice(st.mark); return s.length ? s : st.block.slice(); }
    return st.prev.slice();
  }

  // ---- section handlers (return false when the statement does not belong to the section)
  function hJoints(t, line) {
    if (kw(t[0], 'REPEAT')) {
      let i = 1, all = false; if (t[1] === 'ALL') { all = true; i = 2; }
      const n = Math.round(num(t[i++])), d = t.slice(i).map(num);
      if (isNaN(n) || d.some(isNaN)) { warn(line, 'Unreadable REPEAT in joint coordinates'); return true; }
      const src = repeatSrc(jc, all);
      if (src.length && n > 0) {
        let lo = Infinity, hi = -Infinity; for (const e of src) { if (e.id < lo) lo = e.id; if (e.id > hi) hi = e.id; }
        const span = hi - lo + 1, sets = Math.max(1, Math.floor(d.length / 3));
        let dx = 0, dy = 0, dz = 0;
        for (let r = 1; r <= n; r++) {
          const j = Math.min(r - 1, sets - 1) * 3;
          dx += d[j] || 0; dy += d[j + 1] || 0; dz += d[j + 2] || 0;
          for (const e of src) putJoint(e.id + r * span, e.a + dx, e.b + dy, e.c + dz, line);
        }
      }
      if (all) jc.mark = jc.block.length;
      return true;
    }
    if (!isNum(t[0])) return false;
    const v = t.map(num);
    if (v.some(isNaN) || v.length < 2) { warn(line, 'Unreadable joint coordinate line'); return true; }
    if (v.length <= 4) { putJoint(v[0], v[1] || 0, v[2] || 0, v[3] || 0, line); return true; }
    const n1 = v[0], n2 = v[4], step = v[8] || 1, steps = Math.round((n2 - n1) / step);
    const p1 = [v[1], v[2], v[3]], p2 = [v[5] || 0, v[6] || 0, v[7] || 0];
    if (!(steps > 0) || steps > 2e6) { putJoint(n1, p1[0], p1[1], p1[2], line); if (n2 !== n1) putJoint(n2, p2[0], p2[1], p2[2], line); return true; }
    for (let k = 0; k <= steps; k++) {
      const f = k / steps;
      putJoint(n1 + k * step, p1[0] + (p2[0] - p1[0]) * f, p1[1] + (p2[1] - p1[1]) * f, p1[2] + (p2[2] - p1[2]) * f, line);
    }
    return true;
  }
  function hIncRepeat(t, line, put) {
    let i = 1, all = false; if (t[1] === 'ALL') { all = true; i = 2; }
    const n = Math.round(num(t[i])), de = Math.round(num(t[i + 1])), dj = Math.round(num(t[i + 2]));
    if ([n, de, dj].some(isNaN)) { warn(line, 'Unreadable REPEAT in incidences'); return; }
    const src = repeatSrc(inc, all);
    for (let r = 1; r <= n; r++) for (const e of src) put(e.id + r * de, e.n.map(v => v + r * dj));
    if (all) inc.mark = inc.block.length;
  }
  function hMembers(t, line) {
    if (kw(t[0], 'REPEAT')) { hIncRepeat(t, line, (id, n) => putMember(id, n[0], n[1], line)); return true; }
    if (!isNum(t[0])) return false;
    const v = t.map(s => Math.round(num(s)));
    if (v.some(isNaN) || v.length < 3) { warn(line, 'Unreadable member incidence'); return true; }
    putMember(v[0], v[1], v[2], line);
    if (v.length >= 4) {
      const end = v[3], dm = v[4] || 1, dj = v[5] || 1;
      if (end - v[0] < 5e6) for (let id = v[0] + dm, k = 1; id <= end; id += dm, k++) putMember(id, v[1] + k * dj, v[2] + k * dj, line);
    }
    return true;
  }
  function hElems(t, line, solid) {
    if (kw(t[0], 'REPEAT')) { hIncRepeat(t, line, (id, n) => putElem(id, n, line, solid)); return true; }
    if (!isNum(t[0])) return false;
    const ti = t.indexOf('TO');
    const head = t.slice(0, ti < 0 ? t.length : ti).map(s => Math.round(num(s)));
    const tail = ti < 0 ? [] : t.slice(ti + 1).map(s => Math.round(num(s)));
    if (head.some(isNaN) || tail.some(isNaN) || head.length < 4) { warn(line, 'Unreadable element incidence'); return true; }
    const id = head[0], n = head.slice(1);
    putElem(id, n, line, solid);
    if (tail.length) {
      const end = tail[0], de = tail[1] || 1, dj = tail[2] || 1;
      if (end - id < 5e6) for (let e = id + de, k = 1; e <= end; e += de, k++) putElem(e, n.map(v => v > 0 ? v + k * dj : v), line, solid);
    }
    return true;
  }
  function hGroup(t) {
    if (t.length === 1 && t[0][0] !== '_') {
      for (const k of ['JOINT', 'MEMBER', 'ELEMENT', 'SOLID', 'GEOMETRY', 'FLOOR']) if (kw(t[0], k)) { groupKind = k; return true; }
      return false;
    }
    if (t[0][0] !== '_') return false;
    const g = M.groups.get(t[0]) || { name: t[0], kind: groupKind, ids: [] };
    for (const v of parseList(t, 1).ids) g.ids.push(v);
    M.groups.set(t[0], g);
    return true;
  }
  function hMProp(t, line) {
    const L = parseList(t, 0); if (!L.used) return false;
    const rest = t.slice(L.next); if (!rest.length) return true;
    let label = rest.join(' '), kind = 'other';
    if (kw(rest[0], 'TABLE', 2)) { kind = 'table'; label = rest.slice(rest[1] === 'ST' ? 2 : 1).join(' '); if (rest[1] !== 'ST') label = rest.slice(2).join(' ') + ' (' + rest[1] + ')'; }
    else if (kw(rest[0], 'PRISMATIC', 3)) { kind = 'prismatic'; label = 'Prismatic ' + rest.slice(1).join(' ') + ' [' + len.n + ']'; }
    else if (kw(rest[0], 'TAPERED', 3)) { kind = 'tapered'; label = 'Tapered ' + rest.slice(1).join(' ') + ' [' + len.n + ']'; }
    else if (kw(rest[0], 'UPTABLE', 3)) { kind = 'user table'; label = rest.slice(2).join(' ') + ' (user table ' + rest[1] + ')'; }
    else if (kw(rest[0], 'ASSIGN', 3)) { kind = 'assign'; label = 'Assign ' + rest.slice(1).join(' '); }
    let si = secIndex.get(label);
    if (si === undefined) { si = M.sections.length; secIndex.set(label, si); M.sections.push({ label, kind, country, spec: rest.join(' '), count: 0, line }); }
    for (const id of L.ids) { const m = M.members.get(id); if (m) m.sec = si; }
    return true;
  }
  function hEProp(t) {
    const L = parseList(t, 0); if (!L.used) return false;
    const rest = t.slice(L.next);
    if (kw(rest[0], 'THICKNESS', 2) && isNum(rest[1])) for (const id of L.ids) { const p = M.plates.get(id); if (p) { p.thk = num(rest[1]); p.thkUnit = len.n; } }
    return true;
  }
  function hConst(t) {
    const a = t[0];
    if (a === 'BETA') {
      if (!isNum(t[1])) return true;
      const b = num(t[1]), T = targets(t, 2);
      if (T.all) for (const m of M.members.values()) m.beta = b; else for (const id of T.ids) { const m = M.members.get(id); if (m) m.beta = b; }
      return true;
    }
    if (kw(a, 'MATERIAL', 3)) {
      const name = t[1] || '', T = targets(t, 2);
      const set = o => { if (o) o.mat = name; };
      if (T.all) { M.members.forEach(set); M.plates.forEach(set); M.solids.forEach(set); }
      else for (const id of T.ids) { set(M.members.get(id)); set(M.plates.get(id)); set(M.solids.get(id)); }
      return true;
    }
    return /^(E|G|POI|POISSON|DEN|DENSITY|ALPHA|DAMP|CDAMP|REF|REFJT|REFVECTOR|TYPE)$/.test(a) || kw(a, 'POISSON') || kw(a, 'DENSITY');
  }
  function hMaterial(t) {
    if (kw(t[0], 'ISOTROPIC', 3) || /^2DORTHO|^ORTHO/.test(t[0])) { curMat = { name: t[1] || '?', props: [] }; M.materials.set(curMat.name, curMat); return true; }
    if (curMat) { curMat.props.push([t[0], t.slice(1).join(' ')]); return true; }
    return false;
  }
  const DOFS = ['FX', 'FY', 'FZ', 'MX', 'MY', 'MZ'];
  function hSupports(t, line) {
    const L = parseList(t, 0); if (!L.used) return false;
    const rest = t.slice(L.next), spec = rest.join(' ');
    const has = k => rest.some(x => kw(x, k));
    const but = rest.indexOf('BUT'), released = [], springs = [];
    if (but >= 0) for (let i = but + 1; i < rest.length; i++) {
      if (DOFS.includes(rest[i])) released.push(rest[i]);
      else if (/^K[FM][XYZ]$/.test(rest[i])) { springs.push(rest[i] + ' ' + (rest[i + 1] || '')); i++; }
    }
    let kind = 'other';
    if (has('PINNED')) kind = 'pinned';
    else if ((has('FIXED') || has('ENFORCED')) && but < 0) kind = 'fixed';
    else if (but >= 0) {
      const tr = released.filter(d => d[0] === 'F').length, ro = released.filter(d => d[0] === 'M').length;
      kind = springs.length ? 'spring' : tr ? 'roller' : ro === 3 ? 'pinned' : ro ? 'partial' : 'fixed';
    }
    else if (has('ELASTIC') || has('SPRING')) kind = 'spring';
    for (const id of L.ids) M.supports.set(id, { id, kind, spec, released, springs, line });
    return true;
  }
  function hRelease(t) {
    const L = parseList(t, 0); if (!L.used) return false;
    const rest = t.slice(L.next); if (!rest.length) return true;
    const where = kw(rest[0], 'START', 2) ? 's' : kw(rest[0], 'END', 2) ? 'e' : 'b', dofs = rest.slice(1).join(' ') || 'released';
    for (const id of L.ids) {
      const m = M.members.get(id); if (!m) continue;
      m.rel = m.rel || { s: '', e: '' };
      if (where !== 'e') m.rel.s = dofs; if (where !== 's') m.rel.e = dofs;
    }
    return true;
  }
  function hAttr(t) {
    const L = parseList(t, 0); if (!L.used) return false;
    for (const id of L.ids) { const m = M.members.get(id); if (m) m.attr = attr; }
    return true;
  }
  const loadUnits = () => ({ fF: frc.f, fN: frc.n, lF: len.f, lN: len.n });
  function hLoadJoint(t, line) {
    const L = parseList(t, 0); if (!L.used) return false;
    const f = {};
    for (let i = L.next; i < t.length - 1; i++) if (DOFS.includes(t[i]) && isNum(t[i + 1])) { f[t[i]] = num(t[i + 1]); i++; }
    curLoad.items.push({ kind: 'joint', ids: L.ids, f, line, ...loadUnits() });
    return true;
  }
  function hLoadMember(t, line) {
    const L = parseList(t, 0); if (!L.used) return false;
    const type = t[L.next]; let i = L.next + 1, dir = 'GY';
    if (/^(G|P)?[XYZ]$/.test(t[i] || '')) dir = t[i++];
    const vals = []; while (isNum(t[i])) vals.push(num(t[i++]));
    if (type) curLoad.items.push({ kind: 'member', ids: L.ids, type, dir, vals, line, ...loadUnits() });
    return true;
  }
  function hLoadElem(t, line) {
    const L = parseList(t, 0); if (!L.used) return false;
    const type = t[L.next]; let i = L.next + 1, dir = 'LZ';
    if (/^(G|L)?[XYZ]$/.test(t[i] || '')) { dir = t[i++]; if (dir.length === 1) dir = 'L' + dir; }
    const vals = []; while (isNum(t[i])) vals.push(num(t[i++]));
    if (type && kw(type, 'PRESSURE', 2)) curLoad.items.push({ kind: 'elem', ids: L.ids, type: 'PR', dir, vals, line, ...loadUnits() });
    return true;
  }
  function hCombo(t) {
    if (!isNum(t[0])) return false;
    for (let i = 0; i + 1 < t.length; i += 2) if (isNum(t[i + 1])) curCombo.factors.push({ id: t[i], f: num(t[i + 1]) });
    return true;
  }

  // ---- command headers
  function command(t, s, line) {
    const a = t[0], b = t[1];
    if (kw(a, 'UNIT', 4)) {

        const L = LEN_UNITS[k.slice(0, 3)] || LEN_UNITS[k.slice(0, 2)], F = FRC_UNITS[k.slice(0, 3)] || FRC_UNITS[k.slice(0, 2)];
        if (L) { len = { f: L[0], n: L[1] }; M.unitSeen = true; } else if (F) frc = { f: F[0], n: F[1] };

      return 'keep';
    }
    if (a === 'SET') { if (b === 'Z' && t[2] === 'UP') M.zUp = true; return 'keep'; }

    if (kw(a, 'FINISH')) { endLoad(); section = 'other'; return true; }

    }

    if (kw(a, 'ELEMENT') && kw(b, 'INCIDENCES')) { geo(); section = t.some(x => kw(x, 'SOLID')) ? 'solids' : 'plates'; inc = { block: [], mark: 0, prev: [] }; return true; }
    if (kw(a, 'MEMBER') && b && b.startsWith('PRO')) { endLoad(); section = 'mprop'; country = t[2] || ''; return true; }
    if (kw(a, 'ELEMENT') && b && b.startsWith('PRO')) { endLoad(); section = 'eprop'; return true; }
    if (kw(a, 'MEMBER') && kw(b, 'RELEASES')) { endLoad(); section = 'mrel'; return true; }
    if (kw(a, 'MEMBER') && ['TRUSS', 'TENSION', 'COMPRESSION', 'CABLE'].some(k => kw(b, k))) {

    }
    if (curLoad && kw(a, 'MEMBER') && kw(b, 'LOAD')) { section = 'load.member'; return true; }
    if (curLoad && kw(a, 'JOINT') && kw(b, 'LOAD')) { section = 'load.joint'; return true; }
    if (curLoad && kw(a, 'ELEMENT') && kw(b, 'LOAD')) { section = t.length === 2 ? 'load.elem' : 'load.other'; return true; }

    }
    if (kw(a, 'CONSTANTS', 4)) { endLoad(); section = 'const'; return true; }
    if (kw(a, 'SUPPORTS') && t.length === 1) { endLoad(); section = 'supports'; return true; }
    if (a === 'DEFINE') { endLoad(); section = kw(b, 'MATERIAL') ? 'material' : 'other'; curMat = null; return true; }
    if (/^LOAD(ING)?$/.test(a)) {
      endLoad();
      if (kw(b, 'COMBINATION', 4)) {
        let i = 2; if (!isNum(t[i])) i++;

  }

  const LOAD_END = /^(PERF|PRIN|PARA|CHEC|SELE|CHAN|STEE|CONC|DESI|CODE|TRAC|PDEL|NONL|CUT|MODE|SLAV|FLOOR DIA|OUTP|PAGE|INPU|GENE|TAKE)/;

    const t = s.toUpperCase().split(/[\s,]+/).filter(Boolean);
    if (!t.length) return;
    if (section === 'job' && t[0] !== 'END') { M.job.push(s); return; }
    if (section === 'skip' && t[0] !== 'END') return;

    if (!isNum(t[0]) && t[0][0] !== '_') r = command(t, s, line);

        case 'joints': r = hJoints(t, line); break;
        case 'members': r = hMembers(t, line); break;
        case 'plates': r = hElems(t, line, false); break;
        case 'solids': r = hElems(t, line, true); break;
        case 'group': r = hGroup(t); break;
        case 'mprop': r = hMProp(t, line); break;
        case 'eprop': r = hEProp(t); break;
        case 'const': r = hConst(t); break;
        case 'material': r = hMaterial(t); break;
        case 'supports': r = hSupports(t, line); break;
        case 'mrel': r = hRelease(t); break;
        case 'mattr': r = hAttr(t); break;
        case 'load.joint': r = hLoadJoint(t, line); break;
        case 'load.member': r = hLoadMember(t, line); break;
        case 'load.elem': r = hLoadElem(t, line); break;

  for (const L of logical) {
    const up = L.s.toUpperCase();
    if (!M.type && /^STAAD\s/.test(up + ' ')) {
      const m = /^STAAD\s+(\S+)\s*(.*)$/i.exec(L.s);
      if (m) { M.type = m[1].toUpperCase(); M.title = m[2].trim(); M.recognised = true; }

    }

    for (const st of L.s.split(';')) { const s = st.trim(); if (s) statement(s, L.line); }

  M.lenUnit = M.unitSeen ? baseLen.n : ''; M.lenF = baseLen.f;

  if (dupNodes) warn(0, `${dupNodes} joint number(s) are defined more than once; the last definition is used.`);
  if (missing) warn(0, `${missing} member(s)/element(s) reference joints that are not defined and are not drawn.`);
  if (zero) warn(0, `${zero} member(s) have zero length.`);
  if (orphan && (M.members.size || M.plates.size || M.solids.size)) warn(0, `${orphan} joint(s) are not connected to any member or element.`);
  if (noSec && M.sections.length) warn(0, `${noSec} member(s) have no section property assigned.`);

}

/* ---- scene: typed arrays in viewer space (Y up) built from the parsed model ---- */
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const unit = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
function toV(M, x, y, z) { return M.zUp ? [x, z, -y] : [x, y, z]; }

function buildScene(M) {
  const n = M.nodes.size, S = { nIndex: new Map(), nid: new Int32Array(n), X: new Float64Array(n), Y: new Float64Array(n), Z: new Float64Array(n) };
  let i = 0, lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
  for (const nd of M.nodes.values()) {
    const p = toV(M, nd.x, nd.y, nd.z);
    S.nIndex.set(nd.id, i); S.nid[i] = nd.id; S.X[i] = p[0]; S.Y[i] = p[1]; S.Z[i] = p[2];
    for (let k = 0; k < 3; k++) { if (p[k] < lo[k]) lo[k] = p[k]; if (p[k] > hi[k]) hi[k] = p[k]; }
    i++;
  }
  if (!n) { lo = [0, 0, 0]; hi = [1, 1, 1]; }
  S.lo = lo; S.hi = hi; S.center = [(lo[0] + hi[0]) / 2, (lo[1] + hi[1]) / 2, (lo[2] + hi[2]) / 2];
  S.diag = Math.hypot(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]) || 1;
  S.sx = new Float32Array(n); S.sy = new Float32Array(n); S.sz = new Float32Array(n);
  // members
  const mem = [...M.members.values()].filter(m => S.nIndex.has(m.a) && S.nIndex.has(m.b));
  S.mem = mem; S.mIndex = new Map(); S.ma = new Int32Array(mem.length); S.mb = new Int32Array(mem.length); S.mcat = new Uint16Array(mem.length);
  mem.forEach((m, k) => { S.mIndex.set(m.id, k); S.ma[k] = S.nIndex.get(m.a); S.mb[k] = S.nIndex.get(m.b); });
  // polygons: plates + solid faces
  S.polys = [];
  for (const p of M.plates.values()) {
    const idx = p.n.map(v => S.nIndex.get(v)); if (idx.some(v => v === undefined) || idx.length < 3) continue;
    S.polys.push({ kind: 'plate', id: p.id, ref: p, idx, cat: 0 });
  }
  const FACES = [[0, 1, 2, 3], [4, 5, 6, 7], [0, 1, 5, 4], [1, 2, 6, 5], [2, 3, 7, 6], [3, 0, 4, 7]];
  for (const s of M.solids.values()) {

    if (idx.length === 8) for (const f of FACES) S.polys.push({ kind: 'solid', id: s.id, ref: s, idx: [...new Set(f.map(k => idx[k]))], cat: 0 });

  const u = M.lenUnit ? ' ' + M.lenUnit : '', ext = M.zUp ? [S.hi[0] - S.lo[0], S.hi[2] - S.lo[2], S.hi[1] - S.lo[1]] : [S.hi[0] - S.lo[0], S.hi[1] - S.lo[1], S.hi[2] - S.lo[2]];
  let total = 0; for (const m of M.members.values()) total += m.len || 0;
  const kv = [['Structure type', esc(M.type || '–')], ['Length unit', M.lenUnit || 'not stated'], ['Vertical axis', M.zUp ? 'Z' : 'Y'],
    ['Nodes', M.nodes.size], ['Members', M.members.size]];
  if (M.plates.size) kv.push(['Plates', M.plates.size]); if (M.solids.size) kv.push(['Solids', M.solids.size]);
  kv.push(['Supports', M.supports.size], ['Sections', M.sections.length]);
  if (M.materials.size) kv.push(['Materials', esc([...M.materials.keys()].join(', '))]);
  if (M.groups.size) kv.push(['Groups', M.groups.size]);
  kv.push(['Load cases', M.loads.length], ['Combinations', M.combos.length], ['Extent X × Y × Z', ext.map(v => fmt(v, 2)).join(' × ') + u], ['Total member length', fmt(total, 2) + u]);
  const chk = (k, t) => `<label><input type="checkbox" data-opt="${k}" ${opt[k] ? 'checked' : ''}>${t}</label>`;
  const lcOpts = M.loads.map(l => `<option value="${esc(l.id)}" ${String(l.id) === state.loadCase ? 'selected' : ''}>${esc(l.id)} · ${esc(l.title || l.type || 'Load case')}</option>`).join('')
    + (M.combos.length ? '<optgroup label="Combinations">' + M.combos.map(c => `<option value="c:${esc(c.id)}" ${'c:' + c.id === state.loadCase ? 'selected' : ''}>${esc(c.id)} · ${esc(c.title || 'Combination')}</option>`).join('') + '</optgroup>' : '');
  el.innerHTML = `
    <h3>${esc(M.title || state.fileName || 'Untitled model')}</h3>
    <p class="sub">${esc(M.job.filter(j => /^JOB\s+NAME/i.test(j)).map(j => j.replace(/^JOB\s+NAME\s*/i, '')).join(' ') || state.fileName)}</p>
    ${M.warnings.length ? '<h2>Checks</h2>' + M.warnings.slice(0, 12).map(w => `<div class="warn">${esc(w.msg)}${w.line ? ` <a data-line="${w.line}">line ${w.line}</a>` : ''}</div>`).join('') + (M.warnings.length > 12 ? `<div class="sub">…and ${M.warnings.length - 12} more</div>` : '') : ''}
    <h2>Summary</h2><dl class="kv">${kv.map(r => `<dt>${r[0]}</dt><dd class="mono">${r[1]}</dd>`).join('')}</dl>
    <h2>Show</h2><div class="checks">
      ${chk('members', 'Members')}${chk('plates', 'Plates / solids')}${chk('nodes', 'Nodes')}${chk('supports', 'Supports')}
      ${chk('releases', 'Releases')}${chk('loads', 'Loads')}${chk('nodeNo', 'Node numbers')}${chk('memNo', 'Member numbers')}
      ${chk('plateNo', 'Plate numbers')}${chk('loadVals', 'Load values')}${chk('fade', 'Depth fade')}${chk('axes', 'Axis triad')}</div>
    <h2>Colour by</h2><div class="row"><select id="colorBy" aria-label="Colour by">
      ${[['none', 'Single colour'], ['section', 'Section'], ['material', 'Material'], ['group', 'Group'], ['type', 'Member type']].map(o => `<option value="${o[0]}" ${state.colorBy === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></div>
    <div class="legend" id="legend"></div>
    <h2>Loads</h2><div class="row"><select id="loadCase" aria-label="Load case"><option value="">None</option>${lcOpts}</select></div>
    <div id="loadInfo"></div>`;
  renderLegend(); renderLoadInfo();
}
function renderLegend() {
  const { S } = state, el = $('#legend'); if (!el) return;
  if (state.colorBy === 'none') { el.innerHTML = ''; return; }
  el.innerHTML = S.cats.map((c, i) => `<button data-cat="${i}" aria-pressed="${state.isolate === i}" title="Click to isolate"><span class="sw" style="background:${c.color}"></span><span class="lb">${esc(c.label)}</span><span class="ct mono">${c.count}</span></button>`).join('');
}
function renderLoadInfo() {
  const { M } = state, el = $('#loadInfo'); if (!el) return;
  const v = state.loadCase; if (!v) { el.innerHTML = ''; return; }
  if (v.startsWith('c:')) {
    const c = M.combos.find(c => 'c:' + c.id === v); if (!c) return;
    el.innerHTML = `<p class="sub">Combination — the factored cases are listed below; pick a primary case to see its loads drawn.</p><pre class="raw mono">${c.factors.map(f => `${fmt(f.f)} × case ${esc(f.id)}`).join('\n') || 'no factors found'}</pre>`; return;
  }
  const l = M.loads.find(l => String(l.id) === v); if (!l) return;
  const drawn = l.items.filter(i => i.kind !== 'self').length, sw = l.items.filter(i => i.kind === 'self');
  el.innerHTML = `<p class="sub">${esc(l.type || 'Primary case')}${sw.length ? ` · self-weight ${sw.map(s => s.dir + ' ' + fmt(s.f)).join(', ')}` : ''}${drawn ? '' : ' · nothing to draw for this case'}</p><pre class="raw mono">${esc(l.raw.join('\n')) || 'empty'}</pre>`;
}
$('#p-model').addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.opt) { state.opt[t.dataset.opt] = t.checked; store('opt', state.opt); requestDraw(); }
  else if (t.id === 'colorBy') { state.colorBy = t.value; applyColorBy(); renderLegend(); requestDraw(); }
  else if (t.id === 'loadCase') { state.loadCase = t.value; renderLoadInfo(); renderSel(); requestDraw(); }
});
$('#p-model').addEventListener('click', ev => {
  const c = ev.target.closest('[data-cat]'), l = ev.target.closest('[data-line]');
  if (c) { const i = +c.dataset.cat; state.isolate = state.isolate === i ? null : i; renderLegend(); requestDraw(); }
  else if (l) { state.srcLine = +l.dataset.line; setTab('source'); }
});

/* ---- tables ---- */
function tableData() {
  const { M } = state, u = M.lenUnit ? ` (${M.lenUnit})` : '', kind = $('#tblKind').value;
  if (kind === 'nodes') return { kind: 'node', head: ['Node', 'X' + u, 'Y' + u, 'Z' + u, 'Support'], rows: [...M.nodes.values()].map(n => [n.id, fmt(n.x, 3), fmt(n.y, 3), fmt(n.z, 3), (M.supports.get(n.id) || { spec: '' }).spec]) };
  if (kind === 'members') return { kind: 'member', head: ['Member', 'Start', 'End', 'Length' + u, 'Section'], rows: [...M.members.values()].map(m => [m.id, m.a, m.b, m.len === undefined ? '–' : fmt(m.len, 3), m.sec >= 0 ? M.sections[m.sec].label : '']) };
  if (kind === 'plates') return { kind: 'plate', head: ['Plate', 'Thickness', 'Nodes'], rows: [...M.plates.values()].map(p => [p.id, p.thk === null ? '–' : fmt(p.thk) + ' ' + p.thkUnit, p.n.join(' ')]) };
  if (kind === 'supports') return { kind: 'node', head: ['Node', 'Type', 'Specification'], rows: [...M.supports.values()].map(s => [s.id, s.kind, s.spec]) };
  return { kind: null, head: ['#', 'Members', 'Section'], rows: M.sections.map((s, i) => [i + 1, s.count, s.label + (s.country ? '  · ' + s.country : '')]) };
}
function renderTable() {
  if (!state.M) return;
  const d = tableData(), f = $('#tblFilter').value.trim().toUpperCase();
  const rows = f ? d.rows.filter(r => r.some(c => String(c).toUpperCase().includes(f))) : d.rows, shown = rows.slice(0, state.tblLimit);
  $('#tblWrap').innerHTML = `<table class="mono"><thead><tr>${d.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${shown.map(r => `<tr ${d.kind ? `data-go="${d.kind}:${r[0]}"` : ''}>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`
    + (rows.length > shown.length ? `<div class="more"><button id="tblMore">Show more (${shown.length} of ${rows.length})</button></div>` : rows.length ? '' : '<div class="empty">Nothing to list.</div>');
  markTableRow();
}
function markTableRow() {
  const s = state.sel, key = s ? `${s.kind}:${s.id}` : '';
  document.querySelectorAll('#tblWrap tbody tr').forEach(tr => tr.classList.toggle('on', !!key && tr.dataset.go === key));
}
$('#tblKind').addEventListener('change', () => { state.tblLimit = 300; renderTable(); });
$('#tblFilter').addEventListener('input', () => { state.tblLimit = 300; renderTable(); });
$('#tblWrap').addEventListener('click', ev => {
  if (ev.target.id === 'tblMore') { state.tblLimit += 1000; renderTable(); return; }
  const tr = ev.target.closest('tr[data-go]'); if (tr) { const [k, id] = tr.dataset.go.split(':'); select({ kind: k, id: +id }, { zoom: true }); }
});

/* ---- source (virtualised) ---- */
const LH = 18, srcEl = $('#src');
function renderSource(scrollToLine) {
  const { M } = state; if (!M) return;
  $('#srcPad').style.height = M.lines.length * LH + 'px';
  if (scrollToLine && state.srcLine) srcEl.scrollTop = Math.max(0, (state.srcLine - 1) * LH - srcEl.clientHeight / 3);
  const a = Math.max(0, Math.floor(srcEl.scrollTop / LH) - 15), b = Math.min(M.lines.length, a + Math.ceil((srcEl.clientHeight || 400) / LH) + 30);
  let h = '';
  for (let i = a; i < b; i++) { const t = M.lines[i]; h += `<div class="ln${i + 1 === state.srcLine ? ' hl' : ''}${/^\s*\*/.test(t) ? ' cm' : ''}"><span class="no">${i + 1}</span><span class="tx">${esc(t) || ' '}</span></div>`; }
  const win = $('#srcWin'); win.style.transform = `translateY(${a * LH}px)`; win.innerHTML = h;
}
srcEl.addEventListener('scroll', () => renderSource(false));

/* =====================================================================================
   Loading files
   ===================================================================================== */
function banner(msg, ms) { const b = $('#banner'); b.textContent = msg; b.style.display = msg ? 'block' : 'none'; clearTimeout(banner.t); if (msg && ms) banner.t = setTimeout(() => b.style.display = 'none', ms); }
function loadText(text, name) {
  let M;
  try { M = parseStaad(text); } catch (e) { banner('Could not read ' + name + ': ' + e.message); return false; }
  if (!M.nodes.size) {
    banner(/\u0000/.test(text.slice(0, 4000)) ? `${name} looks like a binary file. This viewer reads the text input file (.std).` : `No joint coordinates found in ${name}. Is it a STAAD input (.std) file?`);
    return false;
  }
  state.M = M; state.fileName = name; state.S = buildScene(M);
  state.sel = null; state.hover = null; state.loadCase = ''; state.srcLine = 0; state.tblLimit = 300;
  applyColorBy();
  $('#fname').textContent = name; $('#fname').title = name; document.title = name + ' – STAAD Viewer';
  view.yaw = 0.6; view.pitch = M.type === 'PLANE' || M.type === 'TRUSS' ? 0 : 0.42; if (M.type === 'PLANE' || M.type === 'TRUSS') view.yaw = 0;
  if (M.type === 'FLOOR') { view.yaw = 0; view.pitch = Math.PI / 2; }
  renderModel(); renderSel(); if (state.tab === 'tables') renderTable(); if (state.tab === 'source') renderSource(true);
  fit();
  return true;
}
function decode(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch (e) { return new TextDecoder('windows-1252').decode(buf); }
}
function openFile(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => { if (loadText(decode(r.result), file.name)) banner('', 0); };
  r.onerror = () => banner('Could not read ' + file.name);
  r.readAsArrayBuffer(file);
}
$('#openBtn').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', ev => { openFile(ev.target.files[0]); ev.target.value = ''; });
let dragDepth = 0;
window.addEventListener('dragenter', ev => { ev.preventDefault(); dragDepth++; document.body.classList.add('dragover'); });
window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragover'); } });
window.addEventListener('dragover', ev => ev.preventDefault());
window.addEventListener('drop', ev => { ev.preventDefault(); dragDepth = 0; document.body.classList.remove('dragover'); if (ev.dataTransfer.files.length) openFile(ev.dataTransfer.files[0]); });

/* ---- toolbar + keyboard ---- */
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
$('#fitBtn').addEventListener('click', () => fit());
function toggleProj() { state.persp = !state.persp; $('#projBtn').setAttribute('aria-pressed', state.persp); fit(); }
$('#projBtn').addEventListener('click', toggleProj);
$('#themeBtn').addEventListener('click', () => {
  const dark = getComputedStyle(document.documentElement).getPropertyValue('--canvas').trim() === '#12171b';
  document.documentElement.dataset.theme = dark ? 'light' : 'dark'; store('theme', document.documentElement.dataset.theme); readTheme(); requestDraw();
});
$('#find').addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' || !state.M) return;
  const m = /^\s*([a-z]*)\s*(\d+)\s*$/i.exec(ev.target.value); if (!m) { banner('Type something like n12, m7 or p3.', 2500); return; }
  const id = +m[2], k = m[1].toLowerCase()[0], M = state.M;
  const order = k === 'n' || k === 'j' ? ['node'] : k === 'm' || k === 'b' ? ['member'] : k === 'p' || k === 'e' ? ['plate'] : k === 's' ? ['solid'] : ['member', 'node', 'plate', 'solid'];
  const maps = { node: M.nodes, member: M.members, plate: M.plates, solid: M.solids }, kind = order.find(o => maps[o].has(id));
  if (!kind) { banner(`Nothing numbered ${id} found.`, 2500); return; }
  select({ kind, id }, { zoom: true }); if (state.tab === 'model') setTab('sel');
});
window.addEventListener('keydown', ev => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(ev.target.tagName) || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const k = ev.key.toLowerCase();
  if (k === 'f') fit(); else if (k === 'p') toggleProj(); else if (k === 'escape') select(null);
  else if ('1234'.includes(k)) setView(['iso', 'front', 'side', 'top'][+k - 1]);
});

/* ---- start-up ---- */
{
  const th = recall('theme', null); if (th) document.documentElement.dataset.theme = th;
  Object.assign(state.opt, recall('opt', {}));
  readTheme();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readTheme(); requestDraw(); });
  new ResizeObserver(resize).observe(cv);
  resize();
  loadText(SAMPLE, 'sample.std');
  banner('Showing a built-in sample. Open or drop your own .std file to view it.', 9000);
}
</script>
</body>
</html>
