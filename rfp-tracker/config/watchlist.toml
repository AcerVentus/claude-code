# Watchlist: who and what the tracker recognises in a headline, snippet or job advert.
#
# Alias syntax
#   "Plain text"   matched as a whole word or phrase, ignoring case
#   "cs:Wood"      the same, but case-sensitive (for short or ambiguous names)
#   "re:<regex>"   a raw Python regular expression (ignoring case)
#
# After editing, run:  python3 -m rfp_tracker rebuild
# The register is rebuilt from data/signals.jsonl, so new aliases also apply to past signals.

# ---------------------------------------------------------------------------
# Clients: the ADNOC group. `weight` is added to a signal's relevance score.
# ---------------------------------------------------------------------------

