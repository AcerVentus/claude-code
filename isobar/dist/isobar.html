/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;
	white-space: nowrap;
	-webkit-user-select: none;
	-moz-user-select: none;

:root {
  color-scheme: light;
  --bg: #eef1ee;
  --surface: #fafbf9;
  --surface-2: #e6ebe7;
  --ink: #14212b;
  --ink-2: #44535f;
  --ink-3: #6b7985;
  --line: #d3dbd6;
  --line-2: #bcc7c1;
  --accent: #b0206a;
  --accent-ink: #ffffff;
  --water: #d3e6ef;
  --good: #1f8f5f;
  --warn: #b97d07;
  --bad: #cc3f33;
  --mute: #7b8891;
  --series-1: #257de0;
  --series-2: #f47230;
  --series-3: #00b894;
  --series-4: #f2a600;
  --series-5: #6a4ce2;
  --night-tile: #0b1220;
  --aqi-0: #2e9e6b; --aqi-1: #d9a514; --aqi-2: #e57e25; --aqi-3: #d9483b; --aqi-4: #8e4bb0; --aqi-5: #7a2338;
  --shadow: 0 1px 0 rgba(20, 33, 43, .04), 0 8px 24px -18px rgba(20, 33, 43, .35);
  --font-display: "Bricolage Grotesque", "Avenir Next Condensed", "Helvetica Neue", Arial, sans-serif;
  --font-text: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 14px;
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --topbar-h: 56px;
  --night-shade: rgba(20, 33, 60, .07);
  --map-water: #cfe2ec;
  --map-land-filter: invert(1) brightness(1.3);
  --map-ref-filter: none;
  --map-ref-opacity: .55;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #090f16; --surface: #101923; --surface-2: #17232f; --ink: #e9eff3; --ink-2: #a9b8c3; --ink-3: #7f909c;
    --line: #202e3b; --line-2: #2f4050; --accent: #ff78b6; --accent-ink: #2a0717; --water: #11303f;
    --good: #3ec48a; --warn: #e3ae3a; --bad: #f0685b; --mute: #6d7e8b;
    --series-1: #338ced; --series-2: #e76624; --series-3: #00a888; --series-4: #d28e05; --series-5: #9887ef;
    --shadow: 0 1px 0 rgba(255, 255, 255, .02), 0 10px 30px -20px rgba(0, 0, 0, .8);
    --night-shade: rgba(0, 0, 0, .3); --map-water: #0b1826; --map-land-filter: brightness(.5); --map-ref-filter: invert(1) hue-rotate(180deg) brightness(1.4); --map-ref-opacity: .7;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #090f16; --surface: #101923; --surface-2: #17232f; --ink: #e9eff3; --ink-2: #a9b8c3; --ink-3: #7f909c;
  --line: #202e3b; --line-2: #2f4050; --accent: #ff78b6; --accent-ink: #2a0717; --water: #11303f;
  --good: #3ec48a; --warn: #e3ae3a; --bad: #f0685b; --mute: #6d7e8b;
  --series-1: #338ced; --series-2: #e76624; --series-3: #00a888; --series-4: #d28e05; --series-5: #9887ef;
  --shadow: 0 1px 0 rgba(255, 255, 255, .02), 0 10px 30px -20px rgba(0, 0, 0, .8);
  --night-shade: rgba(0, 0, 0, .3); --map-water: #0b1826; --map-land-filter: brightness(.5); --map-ref-filter: invert(1) hue-rotate(180deg) brightness(1.4); --map-ref-opacity: .7;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--font-text); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--surface); padding: 8px 12px; border-radius: 8px; z-index: 100; }
.skip:focus { left: 8px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: .72em; letter-spacing: .02em; }

/* ---------- top bar */
.topbar { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.topbar-in { max-width: 1280px; margin: 0 auto; min-height: var(--topbar-h); display: flex; align-items: center; gap: 10px; padding-left: var(--gutter); padding-right: var(--gutter-r); }
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; font: 700 19px/1 var(--font-display); font-stretch: 85%; letter-spacing: -.01em; }
.brand svg { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; }
.place-btn { flex: 1 1 auto; min-width: 0; max-width: 420px; display: flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); text-align: left; }
.place-btn:hover { border-color: var(--line-2); }
.place-btn-icon { display: flex; color: var(--ink-3); }
.place-btn-text { min-width: 0; display: flex; align-items: baseline; gap: 8px; }
.place-btn-text > span { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.place-btn-text small { color: var(--ink-3); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.views { display: flex; padding: 3px; border-radius: 999px; background: var(--surface-2); margin-left: auto; }
.view-tab { padding: 6px 14px; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 13.5px; color: var(--ink-2); }
.view-tab[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.tools { display: flex; gap: 2px; }
.icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border: 0; border-radius: 10px; background: transparent; color: var(--ink-2); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ui-icon, .dir-arrow { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.dir-arrow { stroke-width: 2.2; }

/* ---------- weather icons */
.wx-icon { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; overflow: visible; }
.wx-icon .i-sun { stroke: var(--series-4); }
.wx-icon .i-sun circle { fill: color-mix(in srgb, var(--series-4) 28%, transparent); }
.wx-icon .i-moon { stroke: var(--ink-2); fill: color-mix(in srgb, var(--ink-2) 14%, transparent); }
.wx-icon .i-cloud { fill: var(--surface); }
.wx-icon .i-back, .wx-icon .i-thin { opacity: .7; }
.wx-icon .i-rain { stroke: var(--series-1); stroke-width: 1.7; }
.wx-icon .i-bold { stroke-width: 2.1; }
.wx-icon .i-snow { stroke: var(--series-1); }
.wx-icon .i-fog { opacity: .65; }
.wx-icon .i-bolt { stroke: var(--series-4); stroke-width: 1.9; }
.hero .wx-icon .i-cloud { fill: rgba(255, 255, 255, .16); }
.hero .wx-icon .i-moon { stroke: #fff; fill: rgba(255, 255, 255, .2); }
.hero .wx-icon .i-sun { stroke: #ffd872; }
.hero .wx-icon .i-sun circle { fill: rgba(255, 216, 114, .35); }
.hero .wx-icon .i-rain, .hero .wx-icon .i-snow { stroke: #bfe0ff; }

/* ---------- hero */
.hero { position: relative; isolation: isolate; color: #fff; overflow: hidden; background: #1b3a6b; }
#sky { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; display: block; }
.hero-scrim { position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(5, 10, 22, .30), rgba(5, 10, 22, .12) 45%, rgba(5, 10, 22, .42)); }
.hero-in { max-width: 1280px; margin: 0 auto; padding: 28px var(--gutter-r) 26px var(--gutter); display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px 40px; align-items: end; min-height: 330px; }
.hero-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.hero-meta { font: 500 11px/1.4 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; opacity: .86; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.hero-place { font: 700 clamp(26px, 4vw, 40px)/1.05 var(--font-display); font-stretch: 88%; letter-spacing: -.015em; text-wrap: balance; margin-top: 4px; }
.hero-now { display: flex; align-items: center; gap: 18px; margin-top: 6px; flex-wrap: wrap; }
.hero-temp { font: 600 clamp(88px, 15vw, 148px)/.86 var(--font-display); font-stretch: 78%; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
.hero-temp sup { font-size: .38em; font-weight: 500; vertical-align: top; position: relative; top: .12em; letter-spacing: 0; opacity: .85; margin-left: .04em; }
.hero-cond { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.hero-cond-top { display: flex; align-items: center; gap: 10px; font: 600 clamp(19px, 2.4vw, 25px)/1.1 var(--font-display); font-stretch: 90%; }
.hero-sub { font-size: 15px; opacity: .92; display: flex; flex-wrap: wrap; gap: 2px 14px; }
.hero-quip { margin-top: 12px; font: 500 clamp(16px, 1.9vw, 20px)/1.3 var(--font-display); font-stretch: 92%; max-width: 34ch; text-wrap: balance; }
.hero-quip::before { content: "“"; opacity: .6; }
.hero-quip::after { content: "”"; opacity: .6; }
.hero-side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.glass { background: rgba(8, 15, 30, .42); border: 1px solid rgba(255, 255, 255, .16); border-radius: var(--radius); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.agree { padding: 14px 16px 12px; }
.agree-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.agree-title { font: 500 10.5px/1.3 var(--font-mono); letter-spacing: .09em; text-transform: uppercase; opacity: .85; }
.agree-text { margin-top: 8px; font-size: 13.5px; opacity: .92; }
.agree svg { display: block; margin-top: 8px; width: 100%; max-width: 400px; height: auto; }
.agree .ag-axis { stroke: rgba(255, 255, 255, .28); stroke-width: 1; }
.agree .ag-dot { fill: #fff; opacity: .88; }
.agree .ag-dot.obs { fill: #ffd872; opacity: 1; }
.agree .ag-dot.out { fill: none; stroke: #fff; stroke-width: 1.4; opacity: .8; }
.agree .ag-med { stroke: #ff9ccb; stroke-width: 2; }
.agree .ag-band { fill: rgba(255, 156, 203, .22); }
.agree text { fill: #fff; font: 500 9.5px var(--font-mono); opacity: .8; }
.agree-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: 11.5px; opacity: .85; }
.agree-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #fff; margin-right: 5px; vertical-align: baseline; }
.agree-legend i.obs { background: #ffd872; }
.agree-legend i.med { width: 2px; height: 10px; border-radius: 0; background: #ff9ccb; vertical-align: -1px; }
.hero-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.hero-stat { padding: 11px 12px; display: flex; flex-direction: column; gap: 3px; min-width: 0; border-left: 1px solid rgba(255, 255, 255, .13); }
.hero-stat:first-child { border-left: 0; }
.hero-stat b { font: 600 19px/1.1 var(--font-display); font-stretch: 88%; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hero-stat b small { font: 500 11px var(--font-text); opacity: .8; margin-left: 2px; }
.hero-stat span { font: 500 9.5px/1.2 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
.hero-stat em { font-style: normal; font-size: 11.5px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero-skeleton { min-height: 250px; display: grid; align-content: end; gap: 12px; }

/* ---------- confidence chips */
.conf { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font: 600 11.5px/1.3 var(--font-text); color: var(--ink-2); white-space: nowrap; }
button.conf:hover { border-color: var(--line-2); color: var(--ink); }
.conf::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--mute); flex: none; }
.conf.high::before { background: var(--good); }
.conf.medium::before { background: var(--warn); }
.conf.low::before { background: var(--bad); }
.conf.single::before { background: transparent; border: 1.5px solid var(--mute); }
.conf.official::before { background: var(--series-1); }
.hero .conf { background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .28); color: #fff; }
.hero .conf.high::before { background: #5fe0a5; }
.hero .conf.medium::before { background: #ffd166; }
.hero .conf.low::before { background: #ff8a7d; }
.hero .conf.single::before { border-color: #fff; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--mute); flex: none; }
.dot.high { background: var(--good); } .dot.medium { background: var(--warn); } .dot.low { background: var(--bad); }
.dot.single { background: transparent; border: 1.5px solid var(--mute); }

/* ---------- page grid & panels */
.wrap { max-width: 1280px; margin: 0 auto; padding: 18px var(--gutter-r) 40px var(--gutter); }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.span-12 { grid-column: span 12; } .span-7 { grid-column: span 7; } .span-6 { grid-column: span 6; } .span-5 { grid-column: span 5; } .span-3 { grid-column: span 3; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px 18px; min-width: 0; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.panel:empty { min-height: 140px; }
.p-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.p-title { font: 500 10.5px/1.3 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); display: flex; align-items: center; gap: 8px; }
.p-title::before { content: ""; width: 14px; height: 1px; background: var(--accent); }
.p-note { font-size: 12.5px; color: var(--ink-3); }
.p-note a { color: var(--ink-2); }
.big { font: 600 34px/1 var(--font-display); font-stretch: 84%; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.big small { font: 500 14px var(--font-text); color: var(--ink-2); letter-spacing: 0; margin-left: 4px; }
.sub { color: var(--ink-2); font-size: 13.5px; }
.label { font: 500 10px/1.3 var(--font-mono); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13.5px; align-items: baseline; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }
.split { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 18px; align-items: center; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 20px; }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font: 600 20px/1.15 var(--font-display); font-stretch: 86%; font-variant-numeric: tabular-nums; }
.stat b small { font: 500 12px var(--font-text); color: var(--ink-2); margin-left: 3px; }
.stat i { font-style: normal; font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.empty { color: var(--ink-3); font-size: 13.5px; padding: 6px 0; }
.skel { height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--surface-2), color-mix(in srgb, var(--surface-2) 50%, var(--surface)), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
.skel.tall { height: 90px; border-radius: 10px; }
@keyframes shimmer { to { background-position: -200% 0; } }
.verify { display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px; color: var(--ink-2); border-top: 1px dashed var(--line-2); padding-top: 10px; margin-top: auto; }
.verify .conf { flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.chip b { color: var(--ink); font-weight: 600; }
.chip.out { text-decoration: line-through; opacity: .7; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--series-1); vertical-align: middle; margin-right: 6px; }
.legend i.band { height: 9px; border: 0; border-radius: 2px; background: color-mix(in srgb, var(--series-1) 22%, transparent); }
.legend i.dash { border-top-style: dashed; }
.legend i.s2 { border-color: var(--series-2); } .legend i.s4 { border-color: var(--series-4); } .legend i.ink { border-color: var(--ink-3); }
.legend i.band.s2 { background: color-mix(in srgb, var(--series-2) 22%, transparent); }

/* ---------- charts */
.chart { display: block; overflow: visible; max-width: 100%; }
.chart-box { position: relative; min-width: 0; }
.has-hover { touch-action: pan-y; cursor: crosshair; }
.c-grid { stroke: var(--line); stroke-width: 1; }
.c-axis { stroke: var(--line-2); stroke-width: 1; }
.c-tick { fill: var(--ink-3); font: 500 9.5px var(--font-mono); }
.c-label { fill: var(--ink); font: 600 11.5px var(--font-text); font-variant-numeric: tabular-nums; }
.c-label.dim { fill: var(--ink-2); font-weight: 500; }
.c-line { fill: none; stroke: var(--series-1); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.c-line.s2 { stroke: var(--series-2); } .c-line.s3 { stroke: var(--series-3); } .c-line.s4 { stroke: var(--series-4); } .c-line.s5 { stroke: var(--series-5); }
.c-line.ink { stroke: var(--ink-3); } .c-line.dash { stroke-dasharray: 4 4; stroke-width: 1.6; }
.c-area { fill: color-mix(in srgb, var(--series-1) 14%, transparent); stroke: none; }
.c-area.s2 { fill: color-mix(in srgb, var(--series-2) 16%, transparent); } .c-area.s3 { fill: color-mix(in srgb, var(--series-3) 16%, transparent); } .c-area.s5 { fill: color-mix(in srgb, var(--series-5) 16%, transparent); } .c-area.ink { fill: color-mix(in srgb, var(--ink-3) 14%, transparent); }
.c-band { fill: color-mix(in srgb, var(--series-1) 20%, transparent); stroke: none; }
.c-band.s2 { fill: color-mix(in srgb, var(--series-2) 20%, transparent); }
.c-bar { fill: var(--series-1); }
.c-bar.faint { fill: color-mix(in srgb, var(--series-1) 35%, transparent); }
.c-bar.ink { fill: var(--ink-3); } .c-bar.forecast { fill: color-mix(in srgb, var(--series-5) 45%, transparent); } .c-bar.s5 { fill: var(--series-5); }
.c-now { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 2 3; }
.c-now-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.c-dot { fill: var(--series-1); stroke: var(--surface); stroke-width: 2; }
.c-dot.s2 { fill: var(--series-2); } .c-dot.s4 { fill: var(--series-4); }
.c-cross { stroke: var(--ink-3); stroke-width: 1; pointer-events: none; }
.c-shade { fill: var(--surface-2); }
.c-night { fill: var(--night-shade); }
.c-shade.deep { fill: color-mix(in srgb, var(--surface-2) 100%, var(--ink) 8%); }
.chart-tip { position: absolute; z-index: 60; pointer-events: none; background: var(--ink); color: var(--bg); padding: 8px 10px; border-radius: 9px; font-size: 12.5px; line-height: 1.4; max-width: 260px; box-shadow: 0 8px 24px -8px rgba(0, 0, 0, .45); font-variant-numeric: tabular-nums; }
.chart-tip b { display: block; font-weight: 600; margin-bottom: 2px; }
.chart-tip span { display: block; opacity: .86; }

/* ---------- hourly */
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 11px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.tab[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.scroller { overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: thin; margin: 0 -18px; padding: 0 18px 6px; }
.scroller:focus-visible { outline-offset: -2px; }

/* ---------- daily */
.days { display: flex; flex-direction: column; }
.day { display: grid; grid-template-columns: 74px 30px 62px minmax(0, 1fr) 16px; align-items: center; gap: 10px; padding: 8px 6px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; width: 100%; border-radius: 0; }
.day:first-child { border-top: 0; }
.day:hover { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
.day-name { font-weight: 600; display: flex; flex-direction: column; line-height: 1.2; }
.day-name small { font: 500 10px var(--font-mono); color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; }
.day-rain { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; line-height: 1.25; }
.day-rain b { color: var(--series-1); font-weight: 600; display: block; }
.range { display: grid; grid-template-columns: 34px minmax(0, 1fr) 34px; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.range .lo { color: var(--ink-2); text-align: right; } .range .hi { font-weight: 600; }
.range-track { position: relative; height: 6px; border-radius: 3px; background: var(--surface-2); }
.range-fill { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, var(--series-1), var(--series-4), var(--series-2)); background-size: var(--bgw) 100%; background-position: var(--bgx) 0; }
.range-spread { position: absolute; top: -3px; bottom: -3px; border-radius: 4px; border: 1px solid var(--ink-3); opacity: .55; }
.range-now { position: absolute; top: -3px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--surface); border: 3px solid var(--ink); }

/* ---------- cross-check */
.xrows { display: flex; flex-direction: column; }
.xrow { display: grid; grid-template-columns: minmax(84px, 1fr) 74px minmax(70px, 1.2fr) auto; gap: 10px; align-items: center; padding: 9px 6px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; width: 100%; }
.xrow:first-child { border-top: 0; }
.xrow:hover { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
.xrow-name { font-weight: 500; line-height: 1.2; }
.xrow-name small { display: block; color: var(--ink-3); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.xrow-val { font: 600 17px/1 var(--font-display); font-stretch: 86%; font-variant-numeric: tabular-nums; white-space: nowrap; }
.xrow-val small { font: 500 11px var(--font-text); color: var(--ink-2); margin-left: 2px; }
.strip { width: 100%; height: 18px; display: block; }
.strip .st-axis { stroke: var(--line-2); } .strip .st-dot { fill: var(--ink-2); opacity: .75; } .strip .st-dot.obs { fill: var(--series-4); opacity: 1; }
.strip .st-dot.out { fill: none; stroke: var(--bad); stroke-width: 1.3; opacity: 1; } .strip .st-med { stroke: var(--accent); stroke-width: 2; }

/* ---------- tiles */
.tile { gap: 8px; }
.tile .big { font-size: 30px; }
.dial { width: 100%; max-width: 150px; height: auto; display: block; margin: 0 auto; }
.dial .d-ring { fill: none; stroke: var(--line-2); stroke-width: 1; }
.dial .d-tick { stroke: var(--ink-3); stroke-width: 1; } .dial .d-tick.major { stroke: var(--ink-2); stroke-width: 1.5; }
.dial text { fill: var(--ink-3); font: 600 9px var(--font-mono); text-anchor: middle; }
.dial .d-n { fill: var(--accent); }
.dial .d-arrow { fill: var(--ink); } .dial .d-tail { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.dial .d-spread { fill: color-mix(in srgb, var(--accent) 22%, transparent); }
.dial .d-center { fill: var(--ink); font: 600 17px var(--font-display); } .dial .d-unit { fill: var(--ink-3); font: 500 8px var(--font-mono); }
.meter { position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: visible; }
.meter > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--series-1); }
.meter.scale { background: linear-gradient(90deg, #3b9b5d 0 23%, #d9a514 23% 50%, #e57e25 50% 68%, #d9483b 68% 95%, #8e4bb0 95%); }
.meter .pin { position: absolute; top: -4px; width: 4px; height: 16px; margin-left: -2px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 0 2px var(--surface); }
.layers { display: grid; grid-template-columns: auto 1fr auto; gap: 5px 8px; align-items: center; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.layers .meter { height: 6px; } .layers .meter > i { background: var(--ink-3); }

/* ---------- air */
.gauge { width: 100%; max-width: 230px; height: auto; display: block; }
.gauge .g-track { fill: none; stroke-width: 12; }
.gauge .g-needle { stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; } .gauge .g-hub { fill: var(--ink); }
.gauge .g-val { fill: var(--ink); font: 600 36px var(--font-display); text-anchor: middle; } .gauge .g-sub { fill: var(--ink-3); font: 500 9px var(--font-mono); text-anchor: middle; letter-spacing: .08em; }
.gauge .g-tick { fill: var(--ink-3); font: 500 8.5px var(--font-mono); text-anchor: middle; }
.lvl { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; }
.lvl::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--mute); }
.lvl.l0::before { background: var(--aqi-0); } .lvl.l1::before { background: var(--aqi-1); } .lvl.l2::before { background: var(--aqi-2); } .lvl.l3::before { background: var(--aqi-3); } .lvl.l4::before { background: var(--aqi-4); } .lvl.l5::before { background: var(--aqi-5); }
.poll { display: grid; grid-template-columns: 44px minmax(0, 1fr) 74px; gap: 7px 10px; align-items: center; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.poll .meter > i.over { background: var(--warn); } .poll .meter > i.far { background: var(--bad); }
.poll dd, .poll dt { margin: 0; } .poll .v { text-align: right; color: var(--ink-2); }
.poll .who { position: absolute; top: -3px; bottom: -3px; width: 1.5px; background: var(--ink-2); }

/* ---------- moon */
.moon-wrap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; }
.moon-sky { background: radial-gradient(circle at 50% 40%, #172544, var(--night-tile) 72%); border-radius: 14px; padding: 14px; display: grid; place-items: center; position: relative; }
.moon-sky canvas { display: block; }
.moon-sky .up { position: absolute; top: 6px; left: 0; right: 0; text-align: center; font: 500 8.5px var(--font-mono); letter-spacing: .1em; color: rgba(255, 255, 255, .5); text-transform: uppercase; }
.phases { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.phase { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; font-size: 11.5px; color: var(--ink-2); line-height: 1.25; }
.phase b { color: var(--ink); font-size: 12.5px; font-weight: 600; }
.phase svg { width: 26px; height: 26px; }
.phase .pm-dark { fill: var(--night-tile); stroke: var(--line-2); } .phase .pm-lit { fill: #e9e5d8; }

/* ---------- alerts */
.alerts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.alerts:empty { display: none; }
.alert { border: 1px solid var(--line); border-left: 4px solid var(--warn); background: var(--surface); border-radius: 10px; padding: 0; }
.alert.severe, .alert.extreme { border-left-color: var(--bad); }
.alert.minor, .alert.advice { border-left-color: var(--series-1); }
.alert summary { list-style: none; cursor: pointer; padding: 10px 14px; display: flex; gap: 10px; align-items: center; }
.alert summary::-webkit-details-marker { display: none; }
.alert summary b { font-weight: 600; } .alert summary span { color: var(--ink-2); font-size: 13px; margin-left: auto; text-align: right; }
.alert .alert-body { padding: 0 14px 12px 42px; font-size: 13.5px; color: var(--ink-2); white-space: pre-line; max-width: 80ch; }
.alert .ui-icon { color: var(--warn); } .alert.severe .ui-icon, .alert.extreme .ui-icon { color: var(--bad); } .alert.minor .ui-icon, .alert.advice .ui-icon { color: var(--series-1); }

/* ---------- sources */
.feeds { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2px 22px; }
.feed { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
.feed b { font-weight: 600; } .feed small { display: block; color: var(--ink-3); font-size: 12px; }
.feed .st { width: 9px; height: 9px; border-radius: 50%; background: var(--mute); align-self: center; }
.feed .st.is-ok { background: var(--good); } .feed .st.is-error { background: var(--bad); } .feed .st.is-stale { background: var(--warn); }
.feed .st.is-none, .feed .st.is-skip { background: transparent; border: 1.5px solid var(--mute); } .feed .st.is-loading { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.feed .when { color: var(--ink-3); font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.method { font-size: 13.5px; color: var(--ink-2); max-width: 78ch; display: grid; gap: 8px; }
.method b { color: var(--ink); }
.foot { margin-top: 22px; color: var(--ink-3); font-size: 12.5px; display: grid; gap: 6px; max-width: 90ch; }

/* ---------- dialogs */
.dlg { border: 1px solid var(--line); border-radius: 18px; padding: 0; background: var(--surface); color: var(--ink); width: min(520px, calc(100vw - 24px)); max-height: min(86vh, 760px); box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .55); }
.dlg-wide { width: min(720px, calc(100vw - 24px)); }
.dlg::backdrop { background: rgba(6, 10, 18, .55); backdrop-filter: blur(3px); }
.dlg[open] { display: flex; flex-direction: column; }
.dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 10px 20px; border-bottom: 1px solid var(--line); }
.dlg-head h2 { font: 700 20px/1.1 var(--font-display); font-stretch: 88%; }
.dlg-body { padding: 16px 20px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.field input { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--bg); font-size: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 14px; border-radius: 11px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 600; text-decoration: none; }
.btn:hover { background: var(--surface-2); } .btn.wide { width: 100%; } .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.place-list { display: flex; flex-direction: column; }
.place-row { display: flex; align-items: center; gap: 4px; border-top: 1px solid var(--line); }
.place-row:first-child { border-top: 0; }
.place-pick { flex: 1; min-width: 0; text-align: left; border: 0; background: transparent; padding: 10px 6px; border-radius: 8px; display: flex; flex-direction: column; }
.place-pick:hover { background: var(--surface-2); }
.place-pick b { font-weight: 600; } .place-pick small { color: var(--ink-3); font-size: 12.5px; }
.set-group { display: grid; gap: 8px; }
