<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DWG Viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231c2025'/%3E%3Cpath d='M7 24V8h18M7 24h18M13 8v16M7 15h12' fill='none' stroke='%23ff9f1a' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root {
  --chrome: #262b31;
  --panel: #20242a;
  --raised: #2e343b;
  --line: #363d46;
  --text: #e6e9ed;
  --muted: #94a0ad;
  --accent: #ff9f1a;
  --accent-ink: #1d1203;
  --canvas: #1c2025;
  --danger: #ff7b72;
  --shadow: 0 8px 28px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --chrome: #eef0f3;
  --panel: #f7f8fa;
  --raised: #ffffff;
  --line: #d5dae0;
  --text: #1a1e23;
  --muted: #5d6875;
  --accent: #c2500c;
  --accent-ink: #ffffff;
  --canvas: #ffffff;
  --danger: #b42318;
  --shadow: 0 8px 28px rgba(20, 30, 45, .16);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--chrome);
  color: var(--text);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
#app { display: flex; flex-direction: column; height: 100%; }

.bar {
  display: flex; align-items: center; gap: 8px;
  height: 44px; padding: 0 10px; flex: none;
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; letter-spacing: .01em; margin-right: 6px; white-space: nowrap; }
.brand svg { width: 20px; height: 20px; flex: none; }
.grow { flex: 1 1 auto; min-width: 0; }
.file { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
#file-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#file-meta { color: var(--muted); white-space: nowrap; }
.tools { display: flex; gap: 6px; }

.btn {
  height: 28px; padding: 0 10px; border-radius: 6px; cursor: pointer; white-space: nowrap;
  background: var(--raised); border: 1px solid var(--line);
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--muted); }
.btn:focus-visible, input:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.btn.small { height: 24px; padding: 0 8px; font-size: 12px; }
.btn svg { width: 15px; height: 15px; }
kbd { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted); }

.work { display: flex; flex: 1 1 auto; min-height: 0; }
#side {
  width: 250px; flex: none; display: flex; flex-direction: column;
  background: var(--panel); border-right: 1px solid var(--line);
}
.side-head { display: flex; align-items: baseline; justify-content: space-between; padding: 10px 12px 6px; }
.side-head h2 { margin: 0; font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
#layer-count { color: var(--muted); font-size: 12px; }
#layer-filter {
  margin: 0 10px 8px; height: 28px; padding: 0 8px; border-radius: 6px;
  background: var(--raised); border: 1px solid var(--line);
}
.side-actions { display: flex; gap: 6px; padding: 0 10px 8px; }
#layer-list { list-style: none; margin: 0; padding: 0 4px 8px; overflow: auto; flex: 1 1 auto; }
#layer-list label {
  display: flex; align-items: center; gap: 8px; padding: 3px 8px; border-radius: 5px; cursor: pointer;
}
#layer-list label:hover { background: var(--raised); }
#layer-list input { accent-color: var(--accent); margin: 0; flex: none; }
.swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; border: 1px solid var(--line); }
.layer-name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer-n { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
li.off .layer-name { color: var(--muted); }
.empty-note { color: var(--muted); padding: 8px 12px; }

#stage { position: relative; flex: 1 1 auto; min-width: 0; background: var(--canvas); }
#canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: default; }
#canvas.panning { cursor: grabbing; }
#canvas.measuring { cursor: crosshair; }

.center { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; pointer-events: none; }
.card {
  pointer-events: auto; max-width: 440px; text-align: center; padding: 28px 30px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
}
.card h1 { margin: 0 0 6px; font-size: 19px; font-weight: 650; }
.card p { margin: 0 0 16px; color: var(--muted); }
.card .fine { margin: 16px 0 0; font-size: 12px; }
.card .btn { height: 34px; padding: 0 16px; }
#welcome .card { border-style: dashed; border-width: 1.5px; }
.spinner {
  width: 26px; height: 26px; margin: 0 auto 12px; border-radius: 50%;
  border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
#error h1 { color: var(--danger); }
#error p { overflow-wrap: anywhere; }

#drop {
  position: absolute; inset: 10px; display: grid; place-items: center; pointer-events: none;
  border: 2px dashed var(--accent); border-radius: 12px; font-size: 16px; font-weight: 600;
  background: color-mix(in srgb, var(--canvas) 82%, transparent); color: var(--accent);
}

.float {
  position: absolute; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: var(--shadow);
}
#info { top: 12px; right: 12px; width: 250px; padding: 10px 12px 12px; }
#info header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
#info h2 { margin: 0; font-size: 14px; font-weight: 650; }
#info dl { margin: 0 0 10px; display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; }
#info dt { color: var(--muted); }
#info dd { margin: 0; overflow-wrap: anywhere; }
#info .actions { display: flex; flex-wrap: wrap; gap: 6px; }
.close { background: none; border: 0; cursor: pointer; color: var(--muted); padding: 2px 4px; font-size: 16px; line-height: 1; border-radius: 4px; }
.close:hover { color: var(--text); }
#measure {
  left: 50%; bottom: 14px; transform: translateX(-50%); padding: 8px 14px; white-space: nowrap;
  font-variant-numeric: tabular-nums; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis;
}
#measure b { font-weight: 650; margin-right: 14px; }
#measure span { color: var(--muted); margin-right: 14px; }
#measure span:last-child, #measure b:last-child { margin-right: 0; }

.status {
  display: flex; align-items: center; gap: 12px; height: 30px; padding: 0 10px 0 6px; flex: none;
  border-top: 1px solid var(--line); font-size: 12px;
}
#tabs { display: flex; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; padding: 3px; flex: none; max-width: 50%; }
.tab {
  height: 22px; padding: 0 10px; border-radius: 5px; border: 1px solid transparent; background: none;
  cursor: pointer; white-space: nowrap; color: var(--muted);
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { background: var(--raised); border-color: var(--line); color: var(--text); font-weight: 600; }
#notes { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
#notes button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; }
#coords { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: nowrap; color: var(--muted); }

@media (max-width: 720px) {
  #side { position: absolute; z-index: 3; top: 44px; bottom: 30px; left: 0; box-shadow: var(--shadow); }
  .brand span, #file, .btn .label-wide { display: none; }
  .bar { gap: 5px; padding: 0 6px; }
  .brand { margin-right: 0; }
  .tools { gap: 5px; }
  .btn { padding: 0 8px; }
  #info { width: auto; left: 12px; }
}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="var(--canvas)" stroke="var(--line)"/><path d="M7 24V8h18M7 24h18M13 8v16M7 15h12" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>
      <span>DWG Viewer</span>
    </div>
    <button id="btn-open" class="btn primary" title="Open a drawing (O)">Open&hellip;</button>
    <div id="file" class="file" hidden><span id="file-name"></span><span id="file-meta"></span></div>
    <div class="grow"></div>
    <div id="tools" class="tools" hidden>
      <button id="btn-layers" class="btn" aria-pressed="true" title="Show or hide the layer list (L)">Layers</button>
      <button id="btn-fit" class="btn" title="Zoom to fit the drawing (F). Shift-click to include stray objects.">Fit</button>
      <button id="btn-measure" class="btn" aria-pressed="false" title="Measure a distance between two points (M)">Measure</button>
      <button id="btn-export" class="btn" title="Save the current view as a PNG image">Save <span class="label-wide">PNG</span></button>
    </div>
    <button id="btn-theme" class="btn" title="Switch between dark and light background (B)" aria-label="Switch between dark and light background">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.8a6.2 6.2 0 0 1 0 12.4z" fill="currentColor"/></svg>
    </button>
  </header>

  <div class="work">
    <aside id="side" hidden aria-label="Layers">
      <div class="side-head"><h2>Layers</h2><span id="layer-count"></span></div>
      <input id="layer-filter" type="search" placeholder="Filter layers" aria-label="Filter layers">
      <div class="side-actions">
        <button id="layers-all" class="btn small">All</button>
        <button id="layers-none" class="btn small">None</button>
        <button id="layers-invert" class="btn small">Invert</button>
      </div>
      <ul id="layer-list"></ul>
    </aside>

    <main id="stage">
      <canvas id="canvas" role="img" aria-label="Drawing"></canvas>

      <div id="welcome" class="center">
        <div class="card">
          <h1>Open a drawing</h1>
          <p>Drop a <b>.dwg</b> or <b>.dxf</b> file anywhere in this window, or pick one from your computer.</p>
          <button id="btn-browse" class="btn primary">Choose file&hellip;</button>
          <p class="fine">Files are read on this computer only. Nothing is uploaded.</p>
        </div>
      </div>

      <div id="busy" class="center" hidden>
        <div class="card" role="status">
          <div class="spinner"></div>
          <h1 id="busy-name"></h1>
          <p id="busy-stage" style="margin:0"></p>
        </div>
      </div>

      <div id="error" class="center" hidden>
        <div class="card" role="alert">
          <h1>Could not open this file</h1>
          <p id="error-text"></p>
          <button id="btn-retry" class="btn primary">Choose another file&hellip;</button>
        </div>
      </div>

      <section id="info" class="float" hidden aria-label="Selected object">
        <header><h2 id="info-title"></h2><button id="info-close" class="close" aria-label="Clear selection">&times;</button></header>
        <dl id="info-rows"></dl>
        <div class="actions">
          <button id="info-zoom" class="btn small">Zoom to</button>
          <button id="info-isolate" class="btn small">Isolate layer</button>
          <button id="info-hide" class="btn small">Hide layer</button>
        </div>
      </section>

      <div id="measure" class="float" hidden role="status"></div>
      <div id="drop" hidden>Drop to open</div>
    </main>
  </div>

  <footer class="status">
    <div id="tabs" role="tablist" aria-label="Layouts"></div>
    <div id="notes"></div>
    <div class="grow"></div>
    <div id="coords"></div>
  </footer>
</div>
<input id="file-input" type="file" accept=".dwg,.dxf,.DWG,.DXF" hidden>
<script id="wasm-gz" type="application/octet-stream">__WASM_GZ_B64__</script>
<script id="worker-src" type="text/plain">__WORKER_JS__</script>
<script>__APP_JS__</script>
</body>
</html>
